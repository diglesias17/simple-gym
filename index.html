<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23272c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimpleGym">
<link rel="preload" href="fonts/BarlowCondensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>SimpleGym</title>
<style>
  @font-face { font-family: 'Barlow'; font-weight: 500; font-display: swap; src: url(fonts/Barlow-500.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 600; font-display: swap; src: url(fonts/Barlow-600.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow'; font-weight: 700; font-display: swap; src: url(fonts/Barlow-700.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url(fonts/BarlowCondensed-700.woff2) format('woff2'); }

  :root {
    /* Tiza (fondo), hierro (encabezado) y el lima del logo. */
    --bg: #f2f3f0; --surface: #ffffff; --surface-2: #eceeea; --line: #dfe2dc;
    --text: #16191c; --muted: #666c73;
    --iron: #23272c; --iron-2: #353b42; --on-iron: #f2f4f5; --on-iron-muted: #9ba2a9;
    --lime: #c6f135; --lime-ink: #1a1f00; --accent: #4a7300;
    --done-bg: #eef6dc; --danger: #c62f22;
    /* Colores de discos olímpicos: uno por día de la rutina. */
    --plate-0: #d6402f; --plate-1: #2563c9; --plate-2: #e0ad0b; --plate-3: #2f9a55;
    --radius: 16px; --tabbar-h: 64px;
    --muscle: #b9beb6; --muscle-hover: #a1a79e;
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --surface: #1b1e22; --surface-2: #262a30; --line: #30353c;
      --text: #eef0f2; --muted: #9aa0a8; --accent: #c6f135;
      --done-bg: #1f2810; --danger: #ff6b5e;
      --muscle: #4b525a; --muscle-hover: #5d656e;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 500 16px/1.4 var(--body);
    padding: 0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }
  body.tabs-on { padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
  h1, h2 { margin: 0; }
  svg { display: block; }
  .muted { color: var(--muted); }
  .content { max-width: 560px; margin: 0 auto; padding: 16px 16px 104px; }
  body.rest-on .content { padding-bottom: 150px; }

  /* Encabezado */
  .appbar { background: var(--iron); color: var(--on-iron); padding-top: env(safe-area-inset-top); }
  .appbar.sticky { position: sticky; top: 0; z-index: 5; }
  .appbar.striped { border-bottom: 4px solid var(--plate, var(--lime)); }
  .appbar-in { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .appbar-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; min-height: 60px; }
  .appbar-top > :first-child { justify-self: start; }
  .appbar-top > :last-child { justify-self: end; }
  .appbar-top.solo { grid-template-columns: 1fr auto; min-height: 68px; }
  .appbar h1 { font: 700 22px/1.1 var(--display); letter-spacing: .01em; text-align: center; }
  .appbar-top.solo h1 { font-size: 30px; text-align: left; }
  .brand h1 span { color: var(--lime); }
  .bar-btn { display: flex; align-items: center; gap: 2px; padding: 8px 10px; border-radius: 10px; color: var(--on-iron-muted); font-weight: 600; }
  .bar-btn svg { width: 22px; height: 22px; }
  .bar-btn.go { color: var(--lime); font-weight: 700; }
  .bar-btn:active { background: var(--iron-2); }
  .elapsed { font: 700 19px var(--display); color: var(--on-iron-muted); font-variant-numeric: tabular-nums; }

  /* Títulos dentro del contenido */
  .date-title { font: 700 24px/1.15 var(--display); margin: 4px 0 4px; }
  .group-title { font-size: 15px; font-weight: 700; color: var(--muted); margin: 22px 0 8px; }
  .date-title + .group-title { margin-top: 12px; }

  /* Tarjetas y listas */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 12px 0; }
  .card.list { padding: 0; overflow: hidden; }
  .list-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px; border-top: 1px solid var(--line); }
  .list-row:first-child { border-top: 0; }
  .list-row:active { background: var(--surface-2); }
  .list-row.next { background: color-mix(in srgb, var(--lime) 14%, var(--surface)); }
  .row-main { flex: 1; min-width: 0; display: block; }
  .row-title { display: flex; align-items: center; gap: 8px; font: 700 22px/1.1 var(--display); }
  .row-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; color: var(--muted); margin-top: 3px; }
  .row-meta { display: block; font-size: 13px; font-weight: 600; margin-top: 4px; }
  .chev { flex: none; color: var(--muted); }
  .chev svg { width: 20px; height: 20px; }
  .tag { background: var(--lime); color: var(--lime-ink); font: 700 12px/1 var(--body); padding: 4px 8px; border-radius: 99px; }

  /* Disco: el color identifica el día de la rutina */
  .plate { flex: none; position: relative; width: 40px; height: 40px; border-radius: 50%; background: var(--plate, var(--surface-2));
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), inset 0 0 0 9px rgba(255,255,255,.1); }
  .plate::after { content: ""; position: absolute; inset: 15px; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 2px rgba(0,0,0,.18); }
  .plate.sm { width: 30px; height: 30px; }
  .plate.sm::after { inset: 11px; }
  .plates { display: flex; gap: 6px; margin-top: 8px; }
  .plates .plate { width: 22px; height: 22px; }
  .plates .plate::after { inset: 8px; }

  .resume { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left;
    background: var(--lime); color: var(--lime-ink); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
  .resume b { font: 700 22px/1.1 var(--display); }
  .resume small { display: block; opacity: .8; font-size: 14px; }
  .resume .arrow { font-weight: 700; white-space: nowrap; }
  .note { color: var(--muted); font-size: 14px; border-left: 3px solid var(--lime); padding: 2px 0 2px 12px; margin: 20px 0; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  /* Último entrenamiento */
  .last-when { display: block; font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .last summary { align-items: flex-start; }
  .hist.last .row-sub { -webkit-line-clamp: 2; }
  .reopen { margin-top: 14px; }

  /* Hoja para elegir el día */
  .sheet-bg { position: fixed; inset: 0; z-index: 30; background: rgba(10,12,14,.5); animation: fade .2s ease-out; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-width: 560px; margin: 0 auto; max-height: calc(85dvh / var(--zoom, 1)); overflow-y: auto;
    background: var(--bg); border-radius: 22px 22px 0 0; padding: 6px 16px calc(12px + env(safe-area-inset-bottom)); animation: up .24s ease-out; }
  .sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 6px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .sheet-head h2 { font: 700 26px/1.1 var(--display); }
  @keyframes up { from { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .sheet, .sheet-bg { animation: none; } }

  /* Selector de ejercicios por músculo */
  .sheet.xp { display: flex; flex-direction: column; height: calc(90dvh / var(--zoom, 1)); max-height: none; padding-bottom: 0; }
  .sheet.xp > :not(.xp-foot) { flex: none; }
  .sheet-head h2 { flex: 1; }
  .xp-head { position: sticky; top: -6px; z-index: 1; background: var(--bg); margin: 0 -16px; padding: 4px 16px 8px; min-height: 52px; }
  .xp-head h2 { font-size: 24px; }
  .text-btn { display: inline-flex; align-items: center; gap: 2px; padding: 10px 4px; font-weight: 700; color: var(--accent); }
  .text-btn.back { margin-left: -6px; }
  .text-btn svg { width: 20px; height: 20px; }
  .xp-foot { position: sticky; bottom: 0; margin: auto -16px 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .xp-foot .mini { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; font-size: 15px; }
  .xp-foot svg { width: 18px; height: 18px; }
  .xp-figs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 4px 0 0; }
  .xp-figs figure { margin: 0; text-align: center; }
  .xp-figs figcaption { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .body { display: block; width: 100%; height: min(calc(52dvh / var(--zoom, 1)), 460px); }
  .body .bz { fill: var(--line); }
  .body .mz { fill: var(--muscle); cursor: pointer; transition: fill .12s; }
  .body .mz:hover, .body .mz:active { fill: var(--muscle-hover); }
  .body .mz.on { fill: var(--lime); stroke: var(--iron); stroke-width: 1.2; }
  .body .mz:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2.5; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 14px 0 2px; }
  .chip { padding: 10px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; font-weight: 600; }
  .chip:active { background: var(--surface-2); }
  .sheet.xp .list-row { padding: 12px 14px; }
  .sheet.xp .row-title { font-size: 20px; }
  .xp-btn { color: var(--text); }
  .xp-btn svg { width: 22px; height: 22px; }
  .ed-ex.flash { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--lime) 40%, transparent); } }

  /* Botón flotante */
  .fab { position: fixed; z-index: 8; right: max(16px, calc(50% - 264px)); bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
    display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 22px 0 16px; border-radius: 28px;
    background: var(--iron); color: var(--on-iron); font: 700 20px/1 var(--display); letter-spacing: .01em;
    box-shadow: 0 8px 20px rgba(20,24,28,.28); }
  .fab svg { width: 24px; height: 24px; color: var(--lime); }
  .fab:active { transform: scale(.97); }
  body.rest-on .fab { display: none; }

  /* Pestañas */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: none; background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  body.tabs-on .tabbar { display: block; }
  .tabbar-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tabbar-h); }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--text); }
  .tab.on svg { color: var(--accent); }

  /* Entrada en calor / elongación */
  details > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 700; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "▾"; color: var(--muted); margin-left: 4px; transition: transform .15s; }
  details[open] > summary::after { transform: rotate(180deg); }
  details > summary > span:first-child:not(.plate), .hist .row-main { flex: 1; }
  .phase summary > span:first-child { font: 700 20px var(--display); }
  .wu-head, .wu-row { display: grid; grid-template-columns: 1fr 48px 48px; gap: 8px; align-items: center; }
  .wu-head { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  .wu-row { padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .wu-head + .wu-row, summary + .wu-row { border-top: 0; }
  summary + .wu-row { margin-top: 6px; }

  /* Ejercicios */
  .ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ex-head h2 { font: 700 23px/1.1 var(--display); }
  .target { font: 700 20px var(--display); color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prev { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  .sug { display: block; font-weight: 700; color: var(--accent); }
  .ph-reps { font-weight: 700; }
  .set { display: grid; grid-template-columns: 22px 1fr 1fr 52px; gap: 8px; align-items: center; padding: 4px; margin: 0 -4px; border-radius: 12px; }
  .set.done { background: var(--done-bg); }
  .n { color: var(--muted); font: 700 18px var(--display); text-align: center; font-variant-numeric: tabular-nums; }
  .field { position: relative; display: block; }
  .field input { width: 100%; height: 50px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text); font: 700 24px/1 var(--display); padding: 12px 8px 0 10px; font-variant-numeric: tabular-nums; }
  .field input::placeholder { color: var(--muted); opacity: .6; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field span { position: absolute; right: 7px; top: 4px; font-size: 11px; font-weight: 600; color: var(--muted); pointer-events: none; }
  .check { width: 50px; height: 50px; border-radius: 12px; border: 2px solid var(--line); color: transparent; font-size: 22px; font-weight: 800; justify-self: end; }
  .check.sm { width: 44px; height: 40px; justify-self: center; }
  .set.done .check, .check.on { background: var(--lime); border-color: var(--lime); color: var(--lime-ink); }
  .ex.complete { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .ex-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .count { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .mini { padding: 9px 13px; border-radius: 10px; background: var(--surface-2); font-size: 14px; font-weight: 600; }
  .mini.danger { color: var(--danger); }
  .ghost { padding: 8px 10px; border-radius: 10px; color: var(--muted); font-weight: 600; }
  .ghost:active { background: var(--surface-2); }
  .danger { color: var(--danger); }

  .notes { display: block; }
  .notes span { display: block; font: 700 20px var(--display); margin-bottom: 8px; }
  .notes textarea { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; padding: 10px; resize: vertical; }
  .primary { width: 100%; background: var(--lime); color: var(--lime-ink); font: 700 21px/1 var(--display); letter-spacing: .01em; border-radius: var(--radius); padding: 18px; margin-top: 8px; }
  .block { display: block; width: 100%; margin-top: 8px; padding: 14px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Historial */
  .hist summary { padding: 0; }
  .hist .row-title { font-size: 20px; }
  .hist .row-sub { -webkit-line-clamp: 1; }
  .hist ul { list-style: none; padding: 0; margin: 12px 0 0; }
  .hist li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist li span:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .hist-note { font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .hist-sub { font-size: 13px; margin: 10px 0 0; }

  /* Rutinas */
  .rt.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .rt-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .rt-name { font: 700 24px/1.1 var(--display); }
  .rt .row { margin-top: 12px; }
  .rt-actions { align-items: center; }
  .rt-actions .icon-btn { display: grid; place-items: center; width: 44px; height: 44px; color: var(--text); }
  .rt-actions .icon-btn.danger { color: var(--danger); margin-left: auto; }
  .rt-actions svg { width: 20px; height: 20px; }
  .rt-actions .use { display: flex; align-items: center; gap: 6px; height: 44px; background: var(--lime); color: var(--lime-ink); }
  .rt .row-sub { margin-top: 2px; }
  .empty-card h2 { font: 700 24px var(--display); }
  .empty-card p { font-size: 15px; }
  .menu-ic { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); }
  .menu-ic svg { width: 20px; height: 20px; }
  .tag.soft { background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .ex-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Configuración */
  .set-title { font: 700 22px var(--display); }
  .set-desc { font-size: 14px; margin: 4px 0 12px; }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); }
  .seg button { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-height: 64px; padding: 8px 2px;
    border-radius: 9px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg b { font-family: var(--display); line-height: 1; color: var(--text); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.14); }

  /* Editor */
  .lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
  .lbl .inp { margin-top: 4px; }
  .lbl + .lbl { margin-top: 10px; }
  .inp { display: block; width: 100%; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text); font: 500 16px/1.2 var(--body); padding: 0 12px; }
  textarea.inp { height: auto; padding: 10px 12px; resize: vertical; }
  .inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .inp::placeholder { color: var(--muted); opacity: .7; }
  .ed-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ed-head h2 { font: 700 21px var(--display); }
  .ed-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .day-inp { font: 700 21px var(--display); }
  .ed-ex { border-top: 1px solid var(--line); padding: 10px 0 8px; }
  .ed-ex { container-type: inline-size; }
  .ed-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; }
  @container (max-width: 300px) { .ed-grid { grid-template-columns: repeat(2, 1fr); } }
  /* Chrome en Android dibuja un ▼ en los campos con sugerencias y le reserva espacio al texto. */
  .inp::-webkit-calendar-picker-indicator { display: none !important; }
  .ed-grid .lbl { margin-top: 0; }
  .ed-tools { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .icon-btn { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); font-weight: 700; color: var(--muted); }
  .hint { font-size: 13px; margin: 0 0 8px; }
  .day-tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 -16px 10px; padding: 2px 16px; scrollbar-width: none; }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab { flex: none; display: flex; align-items: center; gap: 7px; padding: 9px 14px; border-radius: 99px; background: var(--surface);
    border: 1px solid var(--line); font-weight: 600; font-size: 15px; white-space: nowrap; }
  .day-tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .day-tab.add { color: var(--muted); border-style: dashed; }
  .plate.xs { width: 14px; height: 14px; }
  .plate.xs::after { display: none; }
  .ed-day[hidden] { display: none; }
  details.ed-ex > .ed-sum { justify-content: flex-start; font-weight: 400; padding: 2px 0; }
  details.ed-ex > .ed-sum > .n { flex: none; width: 22px; }
  .ed-sum-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .ed-sum-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ed-sum-meta { font-size: 13px; color: var(--muted); }
  .ed-sum-meta:empty { display: none; }

  .rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--iron); color: var(--on-iron);

  .rest-time small { display: block; font-size: 12px; font-weight: 600; color: var(--on-iron-muted); }

  .rest.over { background: var(--lime); color: var(--lime-ink); }
  .rest.over small { color: inherit; }
  .rest.over button { background: rgba(0,0,0,.1); }

  .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 20;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; }

const fmtDate = t => new Date(t).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = t => new Date(t).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
const fmtDur = ms => { const m = Math.floor(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtSet = x => x.w ? `${x.w}×${x.r || '?'}` : `${x.r || '?'}`;
const clampInt = (v, min, max, def) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
// Clave de un ejercicio a partir del nombre: sin tildes ni mayúsculas. Vincula el historial entre rutinas.
const exKey = name => String(name).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ejercicio';
const emptyPhase = () => ({ items: [] });
const phaseTotal = p => p ? p.items.reduce((n, it) => n + (+it.sets || 1), 0) : 0;

// Ítems de entrada en calor / elongación: { name, sets, reps }, igual que los ejercicios.
// Antes eran texto libre ("10 × Ranas", '30" Piramidal') con "vueltas" para toda la fase: esas vueltas pasan a ser las series.
function parsePhaseItem(it, sets = 1) {
  if (it && typeof it === 'object') return { name: String(it.name ?? ''), sets: it.sets ?? sets, reps: String(it.reps ?? '') };
  const s = String(it ?? '').trim();
  const m = s.match(/^(\d+(?:[.,]\d+)?\s*(?:"|''|”|″|s\b|seg\b|min\b|')?)\s*(?:[×x]\s+)?(.+)$/i);
  return m ? { name: m[2].trim(), sets, reps: m[1].trim() } : { name: s, sets, reps: '' };
}
const normPhase = p => p && { items: (p.items || []).map(it => parsePhaseItem(it, p.rounds || 1)) };
// "10" → "10 ×"; '30"' o "1 min" quedan como están.
const phaseReps = reps => /^\d+$/.test(reps) ? `${reps} ×` : reps;

// Plan de un día con claves únicas (si un ejercicio se repite en el mismo día, la segunda vez es "-2").
function makePlan(day) {
  const seen = {};
  return day.ex.map(e => {
    let key = exKey(e.name);
    seen[key] = (seen[key] || 0) + 1;
    if (seen[key] > 1) key += '-' + seen[key];
    return { key, name: e.name, sets: e.sets, reps: e.reps, rest: e.rest || null, weight: e.weight || null };
  });
}

try {
  const raw = localStorage.getItem(KEY);
  if (raw) stored = JSON.parse(raw);
} catch {}
// Solo datos del formato actual (v2); los de la primera versión ya no se migran.
if (stored?.v === 2) db = Object.assign(db, stored);
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} }
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

// Antes la entrada en calor y la elongación eran de la rutina (iguales todos los días): pasan a cada día.
// Sirve para los datos guardados, los borradores y los archivos importados. Si ya está convertida, no hace nada.
function phasesToDays(r) {
  if (!r || !PHASES.some(([k]) => k in r)) return r;
  for (const day of r.days || []) for (const [k] of PHASES) day[k] ||= structuredClone(r[k] || emptyPhase());
  for (const [k] of PHASES) delete r[k];
  return r;
}
// Pasa los ítems de texto libre al formato { name, reps } en todos lados. No hace nada si ya están convertidos.
function normalizePhases() {
  const fix = o => { if (o) for (const [k] of PHASES) if (o[k]) o[k] = normPhase(o[k]); };
  [...db.routines, db.draft].forEach(r => { fix(r); r?.days?.forEach(fix); phasesToDays(r); });
  [db.current, ...db.sessions].forEach(s => fix(s?.phases));
}
if ([...db.routines, db.draft].some(r => r && PHASES.some(([k]) => k in r))
  || /"items":\["|"rounds":/.test(JSON.stringify(db))) { normalizePhases(); save(); }

const restDefault = () => db.settings?.restSeconds || REST_SECONDS;
const routineById = id => db.routines.find(r => r.id === id);
const activeRoutine = () => routineById(db.activeId) || null;

// Últimas series hechas de un ejercicio; con routineId, solo en sesiones de esa rutina.
function lastSets(key, routineId) {
  for (let i = db.sessions.length - 1; i >= 0; i--) {
    const s = db.sessions[i];
    if (routineId && s.routineId !== routineId) continue;
    const sets = s.ex?.[key]?.filter(x => x.done);
    if (sets?.length) return { date: s.start, sets };
  }
  return null;
}
const lastOfDay = (r, dayId) => [...db.sessions].reverse().find(s => s.routineId === r.id && s.dayId === dayId);
function nextDayId(r) {
  const last = [...db.sessions].reverse().find(s => s.routineId === r.id);
  const i = last ? r.days.findIndex(d => d.id === last.dayId) : -1;
  return r.days[(i + 1) % r.days.length]?.id;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id); toast.id = setTimeout(() => t.hidden = true, 2200);
}

// Color de disco del día: posición del día en su rutina (rojo, azul, amarillo, verde y vuelve a empezar).
const plateVar = i => i >= 0 ? `style="--plate: var(--plate-${i % 4})"` : '';

// Duración real: si la sesión se reabrió, el tiempo que estuvo cerrada (paused) no cuenta.
const sessDur = s => (s.end ?? Date.now()) - s.start - (s.paused || 0);
const isToday = t => new Date(t).toDateString() === new Date().toDateString();
const reopenBtn = s => !db.current && isToday(s.start)

function appbar({ title, left = '<span></span>', right = '<span></span>', extra = '', cls = '', attrs = '' }) {

}

/* ---------- Navegación ---------- */
const view = () => location.hash.slice(1);
function go(v) { if (view() === v) render(); else location.hash = v; }
addEventListener('hashchange', () => { pickerOpen = false; sheet = null; xp = null; render(); scrollTo(0, 0); });
addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && (pickerOpen || sheet)) { pickerOpen = false; sheet = null; render(); }
  if (ev.key === 'Escape' && xp) { xp = null; xpRender(); }
  // Las zonas del cuerpo son <path> con role="button": Enter y espacio las activan como a un botón.
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('path[role=button]')) {
    ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
});

function render() {
  const v = view();
  let tab = null;   // pestaña marcada; null = pantalla completa sin pestañas (sesión, editor)
  if (v === 'session' && db.current) renderSession();
  else if (v === 'history') renderHistory(), tab = v;
  else if (v === 'routines') renderRoutines(), tab = v;
  else if (v === 'settings') renderSettings(), tab = v;
  else if (v === 'edit') { if (!db.draft) return go('routines'); renderEditor(); }
  else renderHome(), tab = '';
  document.body.classList.toggle('tabs-on', tab !== null);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === tab));
  keepAwake(v === 'session' && !!db.current);
}

// "Hoy", "Ayer" o "Hace N días", contando días de calendario.
function relDay(t) {
  const a = new Date(t), b = new Date();
  a.setHours(12, 0, 0, 0); b.setHours(12, 0, 0, 0);
  const n = Math.round((b - a) / 86400000);
  return n <= 0 ? 'Hoy' : n === 1 ? 'Ayer' : `Hace ${n} días`;
}
const longDate = t => new Date(t).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', '');

function lastCard(s) {
  const done = Object.values(s.ex || {}).flat().filter(x => x.done).length;
  return `
    <details class="card hist last">
      <summary><span class="plate" ${sessPlate(s)}></span>
        <span class="row-main">
          <span class="last-when">${relDay(s.start)}</span>
          <span class="row-title">${esc(s.dayName || '?')}</span>
          <span class="row-sub">${cap(longDate(s.start))}, ${fmtTime(s.start)}</span>
          <span class="row-meta">${fmtDur(sessDur(s))} y ${done} series${s.routineName ? `, ${esc(s.routineName)}` : ''}</span>
        </span></summary>
      <ul>${(s.plan || []).filter(e => s.ex?.[e.key]?.some(x => x.done)).map(e =>
        `<li><span>${esc(e.name)}</span><span>${s.ex[e.key].filter(x => x.done).map(fmtSet).join(' · ')}</span></li>`).join('')}</ul>
      ${s.note ? `<p class="hist-note">${esc(s.note)}</p>` : ''}
      ${reopenBtn(s)}
    </details>`;
}

function startSession(dayId) {
  const r = activeRoutine(), day = r?.days.find(d => d.id === dayId);
  if (!day) return;
  if (db.current) {
    if (db.current.routineId === r.id && db.current.dayId === dayId) return go('session');
    if (!confirm(`Tenés una sesión en curso (${db.current.dayName}). ¿Descartarla y empezar ${day.name}?`)) return;
  }
  const plan = makePlan(day), ex = {};
  for (const e of plan) {
    // Peso a precargar: lo último hecho con esta rutina; si es la primera vez con ella, el sugerido;
    // si no hay sugerido, lo último hecho con cualquier rutina.
    const same = lastSets(e.key, r.id), any = lastSets(e.key);
    const pick = i => (same && (same.sets[i] ?? same.sets.at(-1)).w)
      || (!same && e.weight) || (any && (any.sets[i] ?? any.sets.at(-1)).w) || '';
    ex[e.key] = Array.from({ length: e.sets }, (_, i) => ({ w: pick(i), r: '', done: false }));
  }
  db.current = {
    id: uid(), routineId: r.id, routineName: r.name, dayId, dayName: day.name, dayIndex: r.days.indexOf(day), start: Date.now(),
    plan, phases: { warmup: structuredClone(day.warmup || emptyPhase()), cooldown: structuredClone(day.cooldown || emptyPhase()) },
    warmup: [], cooldown: [], ex, note: '',
  };
  save();
  go('session');
}

/* ---------- Sesión ---------- */
function exCard(e, sets) {
  const last = lastSets(e.key);
  const done = sets.filter(x => x.done).length;
  return `
  <article class="card ex ${done >= sets.length ? 'complete' : ''}" data-ex="${esc(e.key)}">
    <div class="ex-head"><h2>${esc(e.name)}</h2><span class="target">${e.reps ? `${e.sets} × ${esc(e.reps)}` : `${e.sets} series`}</span></div>
    <div class="prev">${e.weight ? `<span class="sug">Sugerido: ${esc(e.weight)} kg</span>` : ''}${last ? `Anterior (${fmtDate(last.date)}): ${last.sets.map(fmtSet).join(' · ')}` : 'Primera vez'}</div>
    ${sets.map((x, i) => {
      const ph = (last?.sets[i] ?? last?.sets.at(-1))?.r || firstNum(e.reps);
      return `
      <div class="set ${x.done ? 'done' : ''}" data-i="${i}">
        <span class="n">${i + 1}</span>
        <label class="field"><input type="text" inputmode="decimal" data-k="w" value="${esc(x.w)}" placeholder="—" autocomplete="off" aria-label="Peso serie ${i + 1}"><span>kg</span></label>
        <label class="field"><input type="text" inputmode="numeric" data-k="r" value="${esc(x.r)}" placeholder="${esc(ph)}" autocomplete="off" aria-label="Repeticiones serie ${i + 1}"><span>reps</span></label>
        <button class="check" data-act="set" aria-label="Serie ${i + 1} hecha">✓</button>
      </div>`;
    }).join('')}
    <div class="ex-foot">
      <span class="count">${done}/${sets.length} series</span><span class="spacer"></span>
      <button class="mini" data-act="rmset" ${sets.length <= 1 ? 'disabled' : ''}>− serie</button>
      <button class="mini" data-act="addset">+ serie</button>
    </div>
  </article>`;
}

// Entrada en calor / elongación: un ítem por fila con un check por serie. Si no tiene ítems, no se muestra.
// El índice del check (serie × cantidad de ítems + ítem) es el mismo que con las "vueltas" de antes.
function phaseCard(kind, title) {
  const s = db.current, p = s.phases?.[kind];
  if (!p?.items.length) return '';
  const st = s[kind] ||= [], n = p.items.length, total = phaseTotal(p);
  const sets = it => +it.sets || 1, max = Math.max(...p.items.map(sets));
  const done = phaseDone(s, kind);
  const cols = `style="grid-template-columns: 1fr repeat(${max}, 48px)"`;
  return `
    <details class="card phase" ${done < total ? 'open' : ''}>
      <summary><span>${title}</span><span class="count" data-count="${kind}">${done}/${total}</span></summary>
      ${max > 1 ? `<div class="wu-head" ${cols}><span></span>${Array.from({ length: max }, (_, r) => `<span>Serie ${r + 1}</span>`).join('')}</div>` : ''}
      ${p.items.map((it, i) => `
        <div class="wu-row" ${cols}><span>${it.reps ? `<b class="ph-reps">${esc(phaseReps(it.reps))}</b> ` : ''}${esc(it.name)}</span>
          ${Array.from({ length: max }, (_, r) => {
            const k = r * n + i;
            return r < sets(it)
              ? `<button class="check sm ${st[k] ? 'on' : ''}" data-act="phase" data-phase="${kind}" data-k="${k}" aria-label="${max > 1 ? `Serie ${r + 1}` : 'Hecho'}">✓</button>`
              : '<span></span>';
          }).join('')}
        </div>`).join('')}
    </details>`;
}
const phaseDone = (s, kind) => (s.phases[kind].items).reduce((c, it, i, a) =>
  c + Array.from({ length: +it.sets || 1 }, (_, r) => s[kind]?.[r * a.length + i]).filter(Boolean).length, 0);

function renderSession() {
  const s = db.current;
  app.innerHTML = `
    ${appbar({ title: esc(s.dayName), cls: 'sticky striped', attrs: sessPlate(s),
      left: `<button class="bar-btn" data-act="home">${ICON.prev}Inicio</button>`,
      right: `<span class="elapsed" id="elapsed">${fmtDur(sessDur(s))}</span>` })}
    <div class="content">
    ${phaseCard('warmup', 'Entrada en calor')}
    ${s.plan.map(e => exCard(e, s.ex[e.key] ||= Array.from({ length: e.sets }, () => ({ w: '', r: '', done: false })))).join('')}
    ${phaseCard('cooldown', 'Elongación')}
    <label class="card notes"><span>Notas</span>
      <textarea data-k="note" rows="3" placeholder="Sensaciones, cambios de carga, molestias…">${esc(s.note)}</textarea>
    </label>
    <button class="primary" data-act="finish">Terminar y guardar</button>
    <button class="ghost danger block" data-act="discard">Descartar sesión</button>
    </div>`;
}

const planEx = key => db.current.plan.find(x => x.key === key);

function refreshCard(card) {
  const e = planEx(card.dataset.ex);
  card.outerHTML = exCard(e, db.current.ex[e.key]);
}

function toggleSet(btn) {
  const card = btn.closest('.ex'), row = btn.closest('.set');
  const sets = db.current.ex[card.dataset.ex], x = sets[+row.dataset.i];
  x.done = !x.done;
  if (x.done) {
    const r = $('[data-k=r]', row), w = $('[data-k=w]', row);
    if (!r.value.trim()) r.value = r.placeholder;
    x.r = r.value.trim(); x.w = w.value.trim();
    // Copiar peso y reps a la serie siguiente si todavía no está hecha.
    const next = sets[+row.dataset.i + 1], nextRow = row.nextElementSibling;
    if (next && !next.done && nextRow?.classList.contains('set')) {
      next.w = x.w; next.r = x.r;
      $('[data-k=w]', nextRow).value = x.w;
      $('[data-k=r]', nextRow).value = x.r;
    }
    startRest(planEx(card.dataset.ex)?.rest || restDefault());
  }
  row.classList.toggle('done', x.done);
  const done = sets.filter(y => y.done).length;
  $('.count', card).textContent = `${done}/${sets.length} series`;
  card.classList.toggle('complete', done >= sets.length);
  save();
}

// Volver a abrir una sesión de hoy que ya se había terminado.
function reopenSession(id) {
  const i = db.sessions.findIndex(x => x.id === id);
  if (i < 0 || db.current) return;
  const { end, ...s } = db.sessions[i];
  s.paused = (s.paused || 0) + Math.max(0, Date.now() - end);
  db.sessions.splice(i, 1);
  db.current = s;
  save(); go('session');
}

function finish() {
  const s = db.current;
  const done = Object.values(s.ex).flat().filter(x => x.done).length;
  if (!done && !confirm('No marcaste ninguna serie. ¿Guardar igual?')) return;
  db.sessions.push({ ...s, end: Date.now() });
  db.sessions.sort((a, b) => a.start - b.start);   // una sesión reabierta vuelve a su lugar
  db.current = null;
  save(); stopRest();
  go('');
  toast('Sesión guardada 💪');
}

// Sugerencias al escribir: primero los nombres que ya usaste (rutinas e historial, con la escritura más reciente),
// después la lista curada. Sin duplicados por clave de nombre (mayúsculas y tildes no cuentan).
function knownNames(fromRoutine, fromSession, curated = []) {
  const seen = new Map();
  const add = n => { const k = exKey(n); if (n && !seen.has(k)) seen.set(k, n); };
  [...db.routines].reverse().forEach(r => fromRoutine(r).forEach(add));
  [...db.sessions].reverse().forEach(s => fromSession(s).forEach(add));
  const byName = (a, b) => a.localeCompare(b, 'es');
  const own = [...seen.values()].sort(byName);
  curated.forEach(add);   // también descarta repetidos entre las listas curadas
  return [...own, ...[...seen.values()].slice(own.length).sort(byName)];
}

// Contorno cerrado y suave que pasa por los puntos (Catmull-Rom → curvas de Bézier).
function blob(pts) {
  const n = pts.length, p = i => pts[(i + n) % n], f = v => Math.round(v * 10) / 10;
  let d = `M${p(0).map(f)}`;
  for (let i = 0; i < n; i++) {
    const [a, b, c, e] = [p(i - 1), p(i), p(i + 1), p(i + 2)];
    d += `C${f(b[0] + (c[0] - a[0]) / 6)},${f(b[1] + (c[1] - a[1]) / 6)} ${f(c[0] - (e[0] - b[0]) / 6)},${f(c[1] - (e[1] - b[1]) / 6)} ${c.map(f)}`;
  }
  return d + 'Z';
}

// Una figura (frente o espalda). Las zonas musculares son botones; `sel` es el grupo resaltado.
function bodySvg(view, sel) {
  const label = g => MUSCLES.find(m => m.id === g).name;
  const seen = new Set();   // un solo botón por grupo para el teclado y los lectores de pantalla
  const shape = (z, pts, main) => z.g
    ? `<path d="${blob(pts)}" class="mz${z.g === sel ? ' on' : ''}" data-act="xp-group" data-g="${z.g}"${main ? ` role="button" tabindex="0" aria-label="${label(z.g)}"` : ''}/>`
    : `<path d="${blob(pts)}" class="bz"/>`;
  return `<svg viewBox="30 4 140 392" class="body" role="group" aria-label="${view === 'front' ? 'Frente' : 'Espalda'}">
    <ellipse cx="100" cy="27" rx="15" ry="19" class="bz"/>
    ${view === 'back' ? `<path d="${blob([[92, 46], [108, 46], [110, 60], [90, 60]])}" class="bz"/>` : ''}
    ${BODY[view].map(z => {
      const main = z.g && !seen.has(z.g);
      if (z.g) seen.add(z.g);
      return shape(z, z.pts, main) + (z.c ? '' : shape(z, z.pts.map(([x, y]) => [200 - x, y]), false));
    }).join('')}
  </svg>`;
}

/* ---------- Selector de ejercicios con la figura del cuerpo ---------- */
let xp = null;   // abierto: { p: ruta del campo en el borrador, g: grupo elegido, last: último grupo visto }

const xpPhase = p => /\.(warmup|cooldown)\./.test(p);
// Nombres que ya usaste: de las fases solo si el campo es de entrada en calor o elongación.
const ownNames = phase => knownNames(
  r => [...(phase ? routinePhaseNames(r) : []), ...r.days.flatMap(d => d.ex.map(e => e.name))],
  s => [...(phase ? PHASES.flatMap(([k]) => (s.phases?.[k]?.items || []).map(i => i.name)) : []), ...(s.plan || []).map(e => e.name)]);
const XP_EXTRA = {
  propios: ['Tus ejercicios', phase => ownNames(phase)],
  cardio: ['Cardio', () => CARDIO],
  movilidad: ['Movilidad y elongación', () => PHASE_ITEMS],
};
function xpGroup(g, phase) {
  const m = MUSCLES.find(m => m.id === g);
  return m ? { name: m.name, ex: m.ex } : { name: XP_EXTRA[g][0], ex: XP_EXTRA[g][1](phase) };
}
const lastText = name => {
  const l = lastSets(exKey(name)), s = l?.sets.at(-1);
  return s ? `Último: ${s.w ? `${s.w} kg × ${s.r || '–'}` : `${s.r} reps`}` : '';
};

function xpSheet() {
  const phase = xpPhase(xp.p), [o, k] = draftRef(xp.p), cur = exKey(o[k] || '');
  const grp = xp.g && xpGroup(xp.g, phase);
  const extras = (phase ? ['movilidad', 'propios', 'cardio'] : ['propios', 'cardio', 'movilidad'])
    .filter(g => g !== 'propios' || ownNames(phase).length);
  return `
    <div class="sheet-bg" data-act="xp-close"></div>
    <section class="sheet xp" role="dialog" aria-modal="true" aria-labelledby="xp-title">
      <div class="sheet-head xp-head">
        ${grp ? `<button class="text-btn back" data-act="xp-back">${ICON.prev}Volver</button>` : ''}
        <h2 id="xp-title">${grp ? esc(grp.name) : 'Elegí el músculo'}</h2>
        <button class="text-btn" data-act="xp-close">Cancelar</button>
      </div>
      ${grp ? `
      <div class="card list">
        ${grp.ex.length ? grp.ex.map(n => {
          const meta = lastText(n), on = exKey(n) === cur || n === xp.match;
          return `
          <button class="list-row ${on ? 'next' : ''}" data-act="xp-pick" data-name="${esc(n)}">
            <span class="row-main"><span class="row-title">${esc(n)}${on ? '<span class="tag">Elegido</span>' : ''}</span>
              ${meta ? `<span class="row-meta">${esc(meta)}</span>` : ''}</span>
          </button>`;
        }).join('') : '<p class="muted hint">Todavía no hay ejercicios acá.</p>'}
      </div>` : `
      <div class="xp-figs">
        <figure>${bodySvg('front', xp.last)}<figcaption>Frente</figcaption></figure>
        <figure>${bodySvg('back', xp.last)}<figcaption>Espalda</figcaption></figure>
      </div>
      <div class="chips">${extras.map(g => `<button class="chip" data-act="xp-group" data-g="${g}">${XP_EXTRA[g][0]}</button>`).join('')}</div>`}
      <div class="xp-foot">
        <button class="mini block" data-act="xp-type">${ICON.plus}Escribir un nombre nuevo</button>
      </div>
    </section>`;
}
const xpRender = () => { const el = $('#xp-root'); if (el) el.innerHTML = xp ? xpSheet() : ''; };

// Palabras de un nombre para compararlo con la lista: sin tildes, conectores ni plurales.
// Así "Press inclinado barra" coincide con "Press inclinado con barra" y "Curl bíceps mancuerna" con "Curl de bíceps con mancuernas".
const STOP = new Set(['con', 'de', 'del', 'en', 'a', 'al', 'la', 'el', 'y', 'o']);
const words = name => new Set(exKey(name).split('-').filter(w => w && !STOP.has(w)).map(w => w.length > 3 ? w.replace(/e?s$/, '') : w));
// Ejercicio de la lista curada más parecido al nombre (o null) y su grupo. Si está en varios grupos, el que lo tiene
// más arriba en su lista (el uso más común); en la entrada en calor y la elongación, primero Movilidad.
function xpMatch(name, phase) {
  const w = words(name);
  if (!w.size) return null;
  const groups = [...(phase ? [['movilidad', PHASE_ITEMS]] : []), ...MUSCLES.map(m => [m.id, m.ex]), ['cardio', CARDIO]];
  let best = null;
  for (const [g, list] of groups) list.forEach((n, i) => {
    const x = words(n), inter = [...w].filter(t => x.has(t)).length, score = inter / (w.size + x.size - inter);
    const pri = phase && g === 'movilidad' ? 0 : 1, c = { g, name: n, score, i, pri };
    if (score >= 0.66 && (!best || score > best.score || (score === best.score && (pri < best.pri || (pri === best.pri && i < best.i))))) best = c;
  });
  return best;
}
// Con un ejercicio ya cargado, el selector abre directo en su grupo, con el ejercicio marcado.
function openPicker(p) {
  const [o, k] = draftRef(p), m = xpMatch(o[k] || '', xpPhase(p));
  xp = { p, g: m?.g || null, last: m?.g || null, match: m?.name };
  xpRender();
}

function xpClick(b) {
  switch (b.dataset.act) {
    case 'xp-open': return openPicker(b.dataset.p);
    case 'xp-group': xp.g = xp.last = b.dataset.g; break;
    case 'xp-back': xp.g = null; break;
    case 'xp-close': xp = null; break;
    case 'xp-type': {
      const p = xp.p; xp = null; xpRender();
      return $(`[data-p="${p}"]`, app)?.focus();
    }
    case 'xp-pick': {
      const [o, k] = draftRef(xp.p), p = xp.p;
      o[k] = b.dataset.name; xp = null; save(); renderEditor();
      const row = $(`[data-p="${p}"]`, app)?.closest('.ed-ex');
      if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('flash'); }
      return;
    }
  }
  xpRender();
  $('.sheet.xp')?.scrollTo(0, 0);
}

const pickBtn = p => `<button class="icon-btn xp-btn" data-act="xp-open" data-p="${p}" aria-label="Elegir por músculo">${ICON.body}</button>`;

// Ejercicio o ítem de fase como acordeón: cerrado es un renglón con el resumen y abierto muestra los campos.
// Los <details> comparten name, así que el navegador deja uno solo abierto. Su ruta en el borrador queda en edOpen.
const exMeta = e => [e.reps ? `${e.sets || '?'} × ${e.reps}` : `${e.sets || '?'} series`, e.weight && `${e.weight} kg`, e.rest && `${e.rest} s`]
  .filter(Boolean).join(' · ');
const itemMeta = it => [+it.sets > 1 && `${it.sets} series`, it.reps && (/^\d+$/.test(it.reps) ? `${it.reps} reps` : it.reps)].filter(Boolean).join(' · ');
const itemSummary = path => {
  const [o] = draftRef(`${path}.name`);
  return { name: String(o.name ?? '').trim(), meta: /\.ex\.\d+$/.test(path) ? exMeta(o) : itemMeta(o) };
};
function edItem(path, i, n, { list, ph, fields, what }) {
  const { name, meta } = itemSummary(path);
  return `
    <details class="ed-ex" name="ed-item" data-item="${path}" ${edOpen === path ? 'open' : ''}>
      <summary class="ed-sum"><span class="n">${i + 1}</span>
        <span class="ed-sum-main"><span class="ed-sum-name">${esc(name || ph)}</span><span class="ed-sum-meta">${esc(meta)}</span></span></summary>
      <div class="ed-row">
        <input class="inp" list="${list}" data-p="${path}.name" value="${esc(name)}" placeholder="${esc(ph)}" autocomplete="off">
        ${pickBtn(`${path}.name`)}</div>
      <div class="ed-grid">${fields}</div>
      <div class="ed-tools">
        <button class="icon-btn" data-act="ed-move" data-p="${path}" data-dir="-1" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
        <button class="icon-btn" data-act="ed-move" data-p="${path}" data-dir="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
        <button class="icon-btn" data-act="ed-del" data-p="${path}" aria-label="Quitar ${what}">✕</button>
      </div>
    </details>`;
}
// Al escribir, el renglón del acordeón (y la pestaña, si es el nombre del día) se actualiza sin redibujar.
function refreshSummary(input) {
  const dm = input.dataset.p.match(/^days\.(\d+)\.name$/);
  if (dm) { const t = $(`.day-tab[data-d="${dm[1]}"] .day-tab-name`, app); if (t) t.textContent = input.value.trim() || `Día ${+dm[1] + 1}`; }
  const det = input.closest('details[data-item]');
  if (!det) return;
  const { name, meta } = itemSummary(det.dataset.item);
  $('.ed-sum-name', det).textContent = name || $('[data-p$=".name"]', det).placeholder;
  $('.ed-sum-meta', det).textContent = meta;
}
const field = (path, k, label, val, attrs = '') =>
  `<label class="lbl">${label}<input class="inp" data-p="${path}.${k}" value="${esc(val ?? '')}" ${attrs} autocomplete="off"></label>`;

// Entrada en calor o elongación de un día. Vacía, es solo un botón para agregarla (y no aparece en la sesión).
function phaseEditor(di, kind, title, ph) {
  const p = db.draft.days[di][kind] ||= emptyPhase();
  const add = label => `<button class="mini" data-act="ed-add-item" data-d="${di}" data-phase="${kind}">${label}</button>`;
  if (!p.items.length) return `<div class="ed-phase empty">${add(`+ ${title}`)}</div>`;
  return `
    <div class="ed-phase">
      <h3 class="ed-sub">${title}</h3>
      ${p.items.map((it, i) => {
        const path = `days.${di}.${kind}.items.${i}`;
        return edItem(path, i, p.items.length, { list: 'phase-items', ph, what: 'ítem',
          fields: field(path, 'sets', 'Series', it.sets, 'inputmode="numeric"') + field(path, 'reps', 'Reps', it.reps, 'placeholder="10"') });
      }).join('')}
      ${add('+ ítem')}

}

// Un día del editor. Se dibujan todos, pero solo se ve el de la pestaña elegida.
function dayEditor(day, di) {
  return `
    <section class="card ed-day" role="tabpanel" ${di === edDay ? '' : 'hidden'}>
      <div class="ed-row">
        <input class="inp day-inp" data-p="days.${di}.name" value="${esc(day.name)}" placeholder="Nombre del día" autocomplete="off">
        <button class="icon-btn" data-act="ed-del" data-p="days.${di}" aria-label="Eliminar día">✕</button>
      </div>
      ${phaseEditor(di, ...PHASES[0])}
      <h3 class="ed-sub">Ejercicios</h3>
      ${day.ex.map((e, ei) => {
        const p = `days.${di}.ex.${ei}`;
        return edItem(p, ei, day.ex.length, { list: 'ex-names', ph: 'Ejercicio', what: 'ejercicio',
          fields: field(p, 'sets', 'Series', e.sets, 'inputmode="numeric"') + field(p, 'reps', 'Reps', e.reps, 'placeholder="8–10"')
            + field(p, 'weight', 'Peso (kg)', e.weight, 'placeholder="—" inputmode="decimal"')
            + field(p, 'rest', 'Descanso (s)', e.rest, `placeholder="${restDefault()}" inputmode="numeric"`) });
      }).join('')}
      <button class="mini" data-act="ed-add-ex" data-d="${di}">+ ejercicio</button>
      ${phaseEditor(di, ...PHASES[1])}
    </section>`;
}

// "days.0.ex.2.name" → [objeto contenedor, clave]
function draftRef(path) {
  const k = path.split('.'), last = k.pop();
  let o = db.draft;
  for (const x of k) o = o[x];
  return [o, last];
}
function editAndFocus(selector) {
  save(); renderEditor();
  const el = $(selector, app);
  if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
}

// Fila nueva: se muestra y se abre el selector; "Escribir el nombre" pasa al teclado.
function addAndPick(p) {
  xp = { p, g: null, last: null };
  edOpen = p.replace(/\.name$/, '');
  save(); renderEditor();
  $(`[data-p="${p}"]`, app)?.scrollIntoView({ block: 'center' });
}

function saveDraft() {
  const d = db.draft;
  const name = String(d.name).trim();
  if (!name) { toast('Poné un nombre a la rutina'); return $('[data-p="name"]', app)?.focus(); }
  const phase = p => ({ items: (p?.items || []).map(it => parsePhaseItem(it))
    .map(it => ({ name: it.name.trim(), sets: clampInt(it.sets, 1, 10, 1), reps: it.reps.trim() })).filter(it => it.name) });
  const days = d.days.map((day, i) => ({
    id: day.id || uid(),
    name: String(day.name).trim() || `Día ${i + 1}`,
    ex: day.ex.filter(e => String(e.name).trim()).map(e => ({
      name: String(e.name).trim(),
      sets: clampInt(e.sets, 1, 10, 3),
      reps: String(e.reps ?? '').trim(),
      weight: String(e.weight ?? '').trim().replace(',', '.') || null,
      rest: String(e.rest ?? '').trim() ? clampInt(e.rest, 10, 600, restDefault()) : null,
    })),
    warmup: phase(day.warmup), cooldown: phase(day.cooldown),
  }));
  if (!days.length) return toast('Agregá al menos un día');
  const empty = days.find(day => !day.ex.length);
  if (empty) { edDay = days.indexOf(empty); renderEditor(); return toast(`${empty.name} no tiene ejercicios`); }
  const r = { id: d.draftOf || uid(), name, note: String(d.note).trim(), created: d.created || Date.now(), days };
  const i = db.routines.findIndex(x => x.id === r.id);
  if (i >= 0) db.routines[i] = r; else db.routines.push(r);
  db.draft = null;
  if (!activeRoutine() || (i < 0 && confirm(`¿Empezar a usar "${r.name}" ahora?`))) db.activeId = r.id;
  save();
  go(db.activeId === r.id && i < 0 ? '' : 'routines');
  toast('Rutina guardada');
}

function editorClick(b) {
  const d = db.draft;
  switch (b.dataset.act) {
    case 'ed-save': return saveDraft(), true;
    case 'ed-cancel':
      if (confirm('¿Descartar los cambios de esta rutina?')) { db.draft = null; save(); go('routines'); }
      return true;
    case 'ed-day': edDay = +b.dataset.d; edOpen = null; return save(), renderEditor(), true;
    case 'ed-add-day':
      d.days.push(newDay(d.days.length + 1, d.days.at(-1)));
      edDay = d.days.length - 1; edOpen = `days.${edDay}.ex.0`;
      return editAndFocus(`[data-p="days.${d.days.length - 1}.ex.0.name"]`), true;
    case 'ed-add-ex': {
      const di = +b.dataset.d, ex = d.days[di].ex;
      ex.push(newEx());
      return addAndPick(`days.${di}.ex.${ex.length - 1}.name`), true;
    }
    case 'ed-add-item': {
      const di = +b.dataset.d, kind = b.dataset.phase, items = d.days[di][kind].items;
      items.push({ name: '', sets: items.at(-1)?.sets || '1', reps: '' });
      return addAndPick(`days.${di}.${kind}.items.${items.length - 1}.name`), true;
    }
    case 'ed-del': {
      const [arr, i] = draftRef(b.dataset.p);
      if (/^days\.\d+$/.test(b.dataset.p) && arr[i].ex.some(e => String(e.name).trim())
        && !confirm(`¿Eliminar ${arr[i].name || 'este día'} con todos sus ejercicios?`)) return true;
      arr.splice(+i, 1);
      if (edOpen?.startsWith(b.dataset.p)) edOpen = null;
      return save(), renderEditor(), true;
    }
    case 'ed-move': {
      const [arr, i] = draftRef(b.dataset.p), j = +i + +b.dataset.dir;
      if (j < 0 || j >= arr.length) return true;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      if (edOpen === b.dataset.p) edOpen = b.dataset.p.replace(/\d+$/, j);
      return save(), renderEditor(), true;
    }
  }
  return false;
}

/* ---------- Historial ---------- */
function sessionCard(s, withDate = false) {
  const done = Object.values(s.ex || {}).flat().filter(x => x.done).length;
  const when = withDate ? `${cap(fmtDate(s.start))}, ` : `${fmtTime(s.start)}, `;
  return `
    <details class="card hist">
      <summary><span class="plate sm" ${sessPlate(s)}></span>
        <span class="row-main">
          <span class="row-title">${esc(s.dayName || '?')}</span>
          <span class="row-sub">${when}${fmtDur(sessDur(s))}, ${done} series</span>
        </span></summary>
      ${s.routineName ? `<p class="muted hist-sub">${esc(s.routineName)}</p>` : ''}
      <ul>${(s.plan || []).filter(e => s.ex?.[e.key]?.some(x => x.done)).map(e =>
        `<li><span>${esc(e.name)}</span><span>${s.ex[e.key].filter(x => x.done).map(fmtSet).join(' · ')}</span></li>`).join('')}</ul>
      ${s.note ? `<p class="hist-note">${esc(s.note)}</p>` : ''}
      ${reopenBtn(s)}
      <button class="ghost danger" data-act="del-session" data-id="${esc(s.id)}">Eliminar</button>
    </details>`;
}

function renderHistory() {
  const list = [...db.sessions].reverse();
  app.innerHTML = `
    ${appbar({ title: 'Historial', cls: 'solo' })}
    <div class="content">
      ${list.length ? list.map(s => sessionCard(s, true)).join('') : '<p class="empty">Todavía no hay sesiones guardadas.</p>'}
    </div>`;
}

/* ---------- Configuración ---------- */
const FONT_SIZES = [['Chica', 0.9], ['Normal', 1], ['Grande', 1.15], ['Muy grande', 1.3]];
const REST_OPTIONS = [60, 90, 120, 180];

// Escala toda la interfaz (texto y botones) con zoom: la app está maquetada en px.
function applySettings() {
  const z = db.settings?.fontScale || 1;
  document.documentElement.style.zoom = z === 1 ? '' : z;
  // El zoom también agranda las medidas en vh: las hojas las dividen por --zoom para no salirse de la pantalla.
  document.documentElement.style.setProperty('--zoom', z);
}

function renderSettings() {
  const cur = db.settings?.fontScale || 1;
  app.innerHTML = `
    ${appbar({ title: 'Configuración', cls: 'solo' })}
    <div class="content">
      <section class="card">
        <h2 class="set-title" id="fs-title">Tamaño de letra</h2>
        <p class="muted set-desc">Agranda o achica toda la app, botones incluidos.</p>
        <div class="seg" role="radiogroup" aria-labelledby="fs-title">
          ${FONT_SIZES.map(([name, z]) => `
            <button role="radio" aria-checked="${z === cur}" class="${z === cur ? 'on' : ''}" data-act="font" data-scale="${z}">
              <b style="font-size:${Math.round(18 * z)}px">Aa</b><span>${name}</span>
            </button>`).join('')}
        </div>
      </section>
      <section class="card">
        <h2 class="set-title" id="rest-title">Descanso por defecto</h2>
        <p class="muted set-desc">Para los ejercicios que no tienen un descanso propio en la rutina.</p>
        <div class="seg" role="radiogroup" aria-labelledby="rest-title">
          ${REST_OPTIONS.map(sec => `
            <button role="radio" aria-checked="${sec === restDefault()}" class="${sec === restDefault() ? 'on' : ''}" data-act="rest-default" data-sec="${sec}">
              <b style="font-size:20px">${mmss(sec * 1000)}</b><span>min</span>
            </button>`).join('')}
        </div>
      </section>
      <section class="card">
        <h2 class="set-title">Copia de seguridad</h2>
        <p class="muted set-desc">Las rutinas y el historial se guardan solo en este navegador. Exportá una copia de vez en cuando.</p>
        <div class="row">
          <button class="mini" data-act="export">Exportar copia</button>
          <button class="mini" data-act="import">Importar copia</button>
        </div>
        <input type="file" id="file" accept="application/json,.json" hidden>
      </section>
    </div>`;
}

function downloadJSON(data, filename) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const exportData = () => downloadJSON(db, `simplegym-${new Date().toISOString().slice(0, 10)}.json`);

/* ---------- Rutina suelta en un archivo ---------- */
// Formato: { type: 'simplegym-rutina', v: 2, routine: { name, note, warmup, cooldown, days } }, sin ids ni historial.
// Sirve para guardar una rutina aparte o pasársela a otra persona.
const ROUTINE_FILE = 'simplegym-rutina';
function exportRoutine(r) {
  const days = r.days.map(d => ({ name: d.name, warmup: d.warmup, ex: d.ex.map(({ name, sets, reps, weight, rest }) => ({ name, sets, reps, weight, rest })),
    cooldown: d.cooldown }));
  downloadJSON({ type: ROUTINE_FILE, v: 2, routine: { name: r.name, note: r.note, days } },
    `rutina-${exKey(r.name)}.json`);
}

// Archivo → borrador de rutina. Acepta el formato de arriba o la rutina sola; devuelve null si no tiene días.
// Si trae entrada en calor o elongación a nivel rutina (formato anterior), se copian a los días que no tengan las suyas.
// No hace falta validar cada campo: el editor y "Guardar" normalizan todo, igual que con una rutina escrita a mano.
function routineFromFile(data) {
  const r = data?.type === ROUTINE_FILE ? data.routine : data;
  if (!r || !Array.isArray(r.days) || !r.days.length) return null;
  const list = v => Array.isArray(v) ? v : [];
  const phase = p => normPhase({ ...p, items: list(p?.items) });
  return {
    name: String(r.name ?? ''), note: String(r.note ?? ''),
    days: r.days.map((d, i) => ({
      id: uid(), name: String(d?.name ?? `Día ${i + 1}`),
      warmup: phase(d?.warmup || r.warmup), cooldown: phase(d?.cooldown || r.cooldown),
      ex: list(d?.ex).map(e => ({ name: String(e?.name ?? ''), sets: e?.sets ?? 3, reps: String(e?.reps ?? ''),
        weight: e?.weight ?? '', rest: e?.rest ?? '' })),
    })),
  };
}

async function importRoutine(file) {
  let data = null;
  try { data = JSON.parse(await file.text()); } catch {}
  const r = routineFromFile(data);
  if (r) return openEditor(r, 'example');
  toast(Array.isArray(data?.routines) ? 'Es una copia completa: importala desde Configuración' : 'Archivo no válido');
}

async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    // Solo copias del formato actual: las de la primera versión (sin "v") ya no se convierten.
    if (data.v !== 2 || !Array.isArray(data.sessions)) throw new Error();
    const ids = new Set(db.sessions.map(s => s.id));
    const added = data.sessions.filter(s => s && s.id && !ids.has(s.id));
    db.sessions = [...db.sessions, ...added].sort((a, b) => a.start - b.start);
    // Rutinas: las del archivo que no estén ya.
    const incoming = Array.isArray(data.routines) ? data.routines : [];
    const newRoutines = incoming.filter(r => r?.id && Array.isArray(r.days) && !routineById(r.id));
    db.routines.push(...newRoutines);
    if (!activeRoutine() && db.routines.length) db.activeId = db.routines[0].id;
    normalizePhases();
    save(); render();
    toast(`${added.length} sesiones y ${newRoutines.length} rutinas importadas`);
  } catch { toast('Archivo no válido'); }
}

/* ---------- Eventos ---------- */
app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.dataset.act.startsWith('xp-')) return void xpClick(b);
  if (b.dataset.act.startsWith('ed-')) return void editorClick(b);
  const s = db.current, id = b.dataset.id;
  switch (b.dataset.act) {
    case 'history': go('history'); break;
    case 'routines': go('routines'); break;
    case 'home': go(''); break;
    case 'resume': go('session'); break;
    case 'resume-draft': go('edit'); break;
    case 'open-picker': pickerOpen = true; render(); break;
    case 'close-picker': pickerOpen = false; render(); break;
    case 'start': startSession(b.dataset.day); break;
    case 'new-routine': sheet = null; render(); openEditor(null); break;
    case 'new-menu': sheet = 'new'; render(); break;
    case 'open-examples': sheet = 'examples'; render(); break;
    case 'close-sheet': sheet = null; render(); break;
    case 'use-example': openEditor(fromTemplate(TEMPLATES[+b.dataset.i]), 'example'); break;
    case 'import-routine': sheet = null; render(); $('#routine-file').value = ''; $('#routine-file').click(); break;
    case 'export-routine': exportRoutine(routineById(id)); break;
    case 'edit-routine': openEditor(routineById(id)); break;
    case 'dup-routine': openEditor(routineById(id), true); break;
    case 'use-routine':
      db.activeId = id; save(); go('');
      toast(`Usando "${routineById(id).name}"`); break;
    case 'del-routine':
      if (confirm(`¿Eliminar "${routineById(id).name}"? El historial de sesiones se mantiene.`)) {
        db.routines = db.routines.filter(r => r.id !== id); save(); render();
      }
      break;
    case 'phase': {
      const kind = b.dataset.phase, k = +b.dataset.k, st = s[kind] ||= [];
      st[k] = !st[k];
      b.classList.toggle('on', st[k]);
      $(`[data-count="${kind}"]`).textContent = `${phaseDone(s, kind)}/${phaseTotal(s.phases[kind])}`;
      save(); break;
    }
    case 'set': toggleSet(b); break;
    case 'addset': case 'rmset': {
      const card = b.closest('.ex'), sets = s.ex[card.dataset.ex];
      if (b.dataset.act === 'addset') sets.push({ w: sets.at(-1)?.w || '', r: sets.at(-1)?.r || '', done: false });
      else if (sets.length > 1) sets.pop();
      save(); refreshCard(card); break;
    }
    case 'finish': finish(); break;
    case 'reopen': reopenSession(id); break;
    case 'discard':
      if (confirm('¿Descartar esta sesión? No se va a guardar.')) { db.current = null; save(); stopRest(); go(''); }
      break;
    case 'del-session':
      if (confirm('¿Eliminar esta sesión del historial?')) {
        db.sessions = db.sessions.filter(x => x.id !== id); save(); render();
      }
      break;
    case 'export': exportData(); break;
    case 'rest-default':
      db.settings = { ...db.settings, restSeconds: +b.dataset.sec }; save(); render(); break;
    case 'font':
      db.settings = { ...db.settings, fontScale: +b.dataset.scale }; save(); applySettings(); render(); break;
    case 'import': $('#file').click(); break;
  }
});

$('#tabbar').addEventListener('click', ev => {
  const t = ev.target.closest('.tab');
  if (t) go(t.dataset.tab);
});

app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.p && db.draft) {
    const [o, k] = draftRef(t.dataset.p);
    o[k] = t.value;
    refreshSummary(t);
    return save();
  }
  const s = db.current;
  if (!s || !t.dataset.k) return;
  if (t.dataset.k === 'note') { s.note = t.value; return save(); }
  const row = t.closest('.set'), card = t.closest('.ex');
  if (row && card) { s.ex[card.dataset.ex][+row.dataset.i][t.dataset.k] = t.value.trim(); save(); }
});

app.addEventListener('toggle', ev => {
  const path = ev.target.dataset?.item;
  if (!path) return;
  if (ev.target.open) edOpen = path; else if (edOpen === path) edOpen = null;
}, true);

app.addEventListener('change', ev => {
  if (ev.target.id === 'file' && ev.target.files[0]) importData(ev.target.files[0]);
});
// Fuera de #app: sigue existiendo aunque la pantalla se vuelva a dibujar mientras se elige el archivo.
$('#routine-file').addEventListener('change', ev => { if (ev.target.files[0]) importRoutine(ev.target.files[0]); });

// Seleccionar el contenido al enfocar un número: más rápido de corregir
app.addEventListener('focusin', ev => { if (ev.target.matches('.field input')) ev.target.select(); });

/* ---------- Temporizador de descanso ---------- */
const restEl = $('#rest');
const rest = { end: 0, total: REST_SECONDS, fired: false, hideId: 0 };
let actx;

function unlockAudio() {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch {}
}
function beep() {
  if (!actx) return;
  const t0 = actx.currentTime;
  [0, 0.25, 0.5].forEach(d => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
    o.connect(g).connect(actx.destination);
    o.start(t0 + d); o.stop(t0 + d + 0.2);
  });
}
function startRest(sec = restDefault()) {
  clearTimeout(rest.hideId);
  Object.assign(rest, { end: Date.now() + sec * 1000, total: sec, fired: false });
  restEl.classList.remove('over');
  restEl.hidden = false; document.body.classList.add('rest-on');
  unlockAudio(); tickRest();
}
function stopRest() {
  clearTimeout(rest.hideId);
  restEl.hidden = true; document.body.classList.remove('rest-on');
}
function tickRest() {
  if (restEl.hidden) return;
  const left = Math.max(0, rest.end - Date.now());
  $('#rest-time').textContent = left > 0 ? mmss(left) : '¡Vamos!';
  $('#rest-fill').style.width = `${Math.min(100, left / (rest.total * 1000) * 100)}%`;
  if (left === 0 && !rest.fired) {
    rest.fired = true;
    restEl.classList.add('over');
    navigator.vibrate?.([200, 100, 200]);
    beep();
    rest.hideId = setTimeout(stopRest, 5000);
  }
}
restEl.addEventListener('click', ev => {
  const v = ev.target.closest('[data-rest]')?.dataset.rest;
  if (!v) return;
  if (v === 'x') return stopRest();
  const left = Math.max(0, rest.end - Date.now()) / 1000;
  const sec = Math.max(5, Math.round(left + +v));
  rest.fired ? startRest(Math.max(15, +v)) : (rest.end = Date.now() + sec * 1000, rest.total = Math.max(rest.total, sec), tickRest());
});

setInterval(() => {
  const el = $('#elapsed');
  if (el && db.current) el.textContent = fmtDur(sessDur(db.current));
  tickRest();
}, 250);

/* ---------- Pantalla siempre encendida durante la sesión ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => wakeLock = null);
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch {}
}
document.addEventListener('visibilitychange', () => keepAwake(view() === 'session' && !!db.current));

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

applySettings();
render();
</script>
