<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f4f1" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimpleGym">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>SimpleGym</title>
<style>
  :root {
    --bg: #0f1012; --surface: #1a1c20; --surface-2: #24272c; --line: #30343a;
    --text: #f2f3f5; --muted: #9aa0a8; --accent: #c6f135; --accent-ink: #141600;
    --done-bg: #1c2410; --danger: #ff6b5e;
    --radius: 14px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f4f1; --surface: #ffffff; --surface-2: #ecede8; --line: #dcdfd8;
      --text: #141516; --muted: #5f656c; --accent: #4f7a00; --accent-ink: #ffffff;
      --done-bg: #eef6dc; --danger: #c62f22;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 560px; margin: 0 auto; padding: 0 16px 32px; }
  body.rest-on main { padding-bottom: 120px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .35; cursor: default; }
  h1, h2 { margin: 0; }
  .muted { color: var(--muted); }

  /* Top bar */
  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 14px 0; }
  .bar h1 { font-size: 20px; font-weight: 700; text-align: center; }
  .bar > :first-child { justify-self: start; }
  .bar > :last-child { justify-self: end; }
  .bar.sticky { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .brand { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
  .brand span { color: var(--accent); }
  .ghost { padding: 8px 10px; border-radius: 10px; color: var(--muted); font-weight: 600; }
  .ghost:active { background: var(--surface-2); }
  .danger { color: var(--danger); }
  .elapsed { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 12px 0; }

  /* Home */
  .resume { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left;
    background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 16px; margin: 4px 0 8px; }
  .resume small { display: block; opacity: .8; }
  .resume .arrow { font-weight: 700; white-space: nowrap; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 4px; font-weight: 700; }
  .day { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 16px; margin: 10px 0; }
  .day:active { transform: scale(.99); }
  .day.next { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .day-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .day-name { font-size: 22px; font-weight: 800; }
  .pill { background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; }
  .day-ex { color: var(--muted); font-size: 14px; margin: 6px 0 8px; }
  .day-last { font-size: 13px; font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin: 20px 0; }

  /* Warm-up */
  details > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after { content: "▾"; color: var(--muted); margin-left: 4px; transition: transform .15s; }
  details[open] > summary::after { transform: rotate(180deg); }
  details > summary > :first-child { flex: 1; }
  .wu-head, .wu-row { display: grid; grid-template-columns: 1fr 48px 48px; gap: 8px; align-items: center; }
  .wu-head { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }
  .wu-row { padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .wu-head + .wu-row, summary + .wu-row { border-top: 0; }
  summary + .wu-row { margin-top: 6px; }

  /* Exercises */
  .ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .ex-head h2 { font-size: 18px; line-height: 1.25; }
  .target { font-weight: 800; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .prev { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }
  .set { display: grid; grid-template-columns: 22px 1fr 1fr 52px; gap: 8px; align-items: center; padding: 4px; margin: 0 -4px; border-radius: 12px; }
  .set.done { background: var(--done-bg); }
  .n { color: var(--muted); font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .field { position: relative; display: block; }
  .field input { width: 100%; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text); font: 600 18px/1 system-ui, sans-serif; padding: 0 44px 0 12px; font-variant-numeric: tabular-nums; }
  .field input::placeholder { color: var(--muted); opacity: .7; font-weight: 500; }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; }
  .check { width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--line); color: transparent; font-size: 22px; font-weight: 800; justify-self: end; }
  .check.sm { width: 44px; height: 40px; justify-self: center; }
  .set.done .check, .check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ex.complete { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .ex-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .count { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  .mini { padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; font-weight: 600; }

  .notes { display: block; }
  .notes span { display: block; font-weight: 700; margin-bottom: 8px; }
  .notes textarea { width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; padding: 10px; resize: vertical; }
  .primary { width: 100%; background: var(--accent); color: var(--accent-ink); font-weight: 800; border-radius: var(--radius); padding: 16px; font-size: 17px; margin-top: 8px; }
  .block { display: block; width: 100%; margin-top: 8px; padding: 14px; }

  /* History */
  .hist summary { padding: 2px 0; }
  .hist summary .muted { font-size: 13px; font-weight: 500; }
  .hist ul { list-style: none; padding: 0; margin: 12px 0 0; }
  .hist li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist li span:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .hist-note { font-size: 14px; color: var(--muted); white-space: pre-wrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row.nowrap { flex-wrap: nowrap; gap: 0; }
  .hist-sub { font-size: 13px; margin: 8px 0 0; }

  /* Rutinas */
  .rt.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .rt-name { font-size: 19px; font-weight: 800; }
  .rt .row { margin-top: 4px; }
  .mini.danger { color: var(--danger); }
  .accent-text { color: var(--accent); }
  .empty-card h2 { font-size: 18px; }
  .empty-card p { font-size: 14px; }

  /* Editor */
  .lbl { display: block; font-size: 12px; font-weight: 700; color: var(--muted); min-width: 0; }
  .lbl .inp { margin-top: 4px; }
  .lbl + .lbl { margin-top: 10px; }
  .inp { display: block; width: 100%; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2);
    color: var(--text); font: 500 16px/1.2 system-ui, sans-serif; padding: 0 12px; }
  textarea.inp { height: auto; padding: 10px 12px; resize: vertical; }
  .inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .inp::placeholder { color: var(--muted); opacity: .7; }
  .ed-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  .ed-head h2 { font-size: 17px; }
  .lbl.inline { display: flex; align-items: center; gap: 8px; }
  .lbl.inline .inp { margin: 0; width: 64px; height: 38px; padding: 0 8px; }
  .ed-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .day-inp { font-size: 18px; font-weight: 800; }
  .ed-ex { border-top: 1px solid var(--line); padding: 10px 0 8px; }
  .ed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ed-grid .lbl { margin-top: 0; }
  .ed-tools { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .icon-btn { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); font-weight: 700; color: var(--muted); }
  .hint { font-size: 13px; margin: 0 0 8px; }

  /* Rest timer */
  .rest { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
    padding: 0 16px calc(12px + env(safe-area-inset-bottom)); }
  .rest-bar { height: 4px; background: var(--surface-2); margin: 0 -16px 10px; }
  .rest-bar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width .25s linear; }
  .rest-row { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 60px 1fr 60px 44px; gap: 8px; align-items: center; }
  .rest-row button { height: 44px; border-radius: 10px; background: var(--surface-2); font-weight: 700; }
  .rest-time { text-align: center; }
  .rest-time small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .rest-time b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .rest.over { background: var(--accent); color: var(--accent-ink); }
  .rest.over small { color: inherit; }

  .toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 20;
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<main id="app"></main>

<div id="rest" class="rest" hidden>
  <div class="rest-bar"><i id="rest-fill"></i></div>
  <div class="rest-row">
    <button data-rest="-15">−15</button>
    <div class="rest-time"><small>Descanso</small><b id="rest-time">1:30</b></div>
    <button data-rest="15">+15</button>
    <button data-rest="x" aria-label="Cerrar descanso">✕</button>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Rutina original (solo para migrar los datos de la versión anterior) ---------- */
const LEGACY_ROUTINE = {
  note: 'Las repeticiones son iniciales: pueden cambiar según suba la carga. Mantener y priorizar la técnica siempre.',
  warmup: {
    rounds: 2,
    items: [
      '10 × Cadera frontal + isquios',
      '10 × Ranas a 1 pierna',
      '30" Piramidal parado, pierna en cajón',
      '10 × Flexión de cadera con bastón',
    ],
  },
  // [id viejo, nombre, series, reps objetivo]
  days: [
    { id: 'd1', name: 'Día 1', ex: [
      ['sentadilla-copa', 'Sentadilla copa', 4, '8–10'],
      ['subidas-cajon', 'Subidas a cajón', 3, '8'],
      ['press-inclinado-barra', 'Press inclinado barra', 4, '10–8'],
      ['polea-alta-abierto', 'Polea alta abierto', 4, '12'],
      ['curl-biceps-manc', 'Curl bíceps mancuerna', 3, '10'],
      ['plancha-toco-hombro', 'Plancha alta toco hombro', 3, '5 c/lado'],
      ['plancha-lateral-remo', 'Plancha lateral alta + remo', 3, '8 c/lado'],
    ]},
    { id: 'd2', name: 'Día 2', ex: [
      ['peso-muerto-rumano', 'Peso muerto rumano (barra o manc.)', 4, '8'],
      ['empuje-cadera-swiss', 'Empuje de cadera swiss ball', 3, '6–8'],
      ['flexiones-camilla', 'Flexiones camilla (isquios)', 3, '10–12'],
      ['press-hombros-manc', 'Press hombros manc. sentado', 3, '8'],
      ['remo-hammer-neutro', 'Remo hammer neutro', 3, '10–12'],
      ['vuelos-laterales', 'Vuelos laterales', 3, '10'],
    ]},
    { id: 'd3', name: 'Día 3', ex: [
      ['prensa-neutro', 'Prensa neutro', 4, '10–12'],
      ['empuje-cadera-1-pierna', 'Empuje de cadera a 1 pierna', 3, '6–8'],
      ['press-plano-barra', 'Press plano barra', 3, '8–10'],
      ['curl-biceps-barra', 'Curl bíceps barra', 3, '10'],
      ['frances-manc', 'Francés mancuerna', 3, '10'],
    ]},
    { id: 'd4', name: 'Día 4', ex: [
      ['sentadilla-zercher', 'Sentadilla Zercher', 4, '6'],
      ['extension-sillon', 'Extensión sillón', 3, '12'],
      ['polea-alta-neutro', 'Polea alta neutro', 4, '10–12'],
      ['press-militar-maquina', 'Press militar máquina', 3, '10'],
      ['extension-barra-polea', 'Extensión barra polea', 3, '12'],
      ['espinales-maquina', 'Espinales máquina', 3, '8–10'],
      ['bicho-muerto-pies', 'Bicho muerto solo pies', 3, '5 c/lado'],
    ]},
  ],
};
const REST_SECONDS = 90;
const MAX_ROUNDS = 4;
const PHASES = [['warmup', 'Entrada en calor', 'Ej.: 10 × Ranas a 1 pierna'], ['cooldown', 'Elongación', 'Ej.: 30" Isquios con banda']];

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const firstNum = s => (String(s).match(/\d+/) || [''])[0];
const fmtDate = t => new Date(t).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = t => new Date(t).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
const fmtDur = ms => { const m = Math.floor(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const fmtSet = x => x.w ? `${x.w}×${x.r || '?'}` : `${x.r || '?'}`;
const clampInt = (v, min, max, def) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : def; };
// Clave de un ejercicio a partir del nombre: sin tildes ni mayúsculas. Vincula el historial entre rutinas.
const exKey = name => String(name).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'ejercicio';
const emptyPhase = () => ({ rounds: 1, items: [] });
const phaseTotal = p => p ? p.items.length * p.rounds : 0;

// Plan de un día con claves únicas (si un ejercicio se repite en el mismo día, la segunda vez es "-2").
function makePlan(day) {
  const seen = {};
  return day.ex.map(e => {
    let key = exKey(e.name);
    seen[key] = (seen[key] || 0) + 1;
    if (seen[key] > 1) key += '-' + seen[key];
    return { key, name: e.name, sets: e.sets, reps: e.reps, rest: e.rest || null };
  });
}

/* ---------- Datos (localStorage) ---------- */
const KEY = 'simplegym:v1';
let db = { v: 2, routines: [], activeId: null, sessions: [], current: null, draft: null };
let stored = null;
try {
  const raw = localStorage.getItem(KEY);
  if (raw) stored = JSON.parse(raw);
} catch {}
if (stored) db = Object.assign(db, stored);
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch {} }
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});

function legacyRoutine() {
  const L = LEGACY_ROUTINE;
  return {
    id: 'r1', name: 'Rutina inicial', note: L.note, created: Date.now(),
    warmup: { rounds: L.warmup.rounds, items: [...L.warmup.items] }, cooldown: emptyPhase(),
    days: L.days.map(d => ({ id: d.id, name: d.name, ex: d.ex.map(([, name, sets, reps]) => ({ name, sets, reps, rest: null })) })),
  };
}
const LEGACY_NAMES = Object.fromEntries(LEGACY_ROUTINE.days.flatMap(d => d.ex.map(([id, name]) => [id, name])));

// Convierte una sesión de la versión 1 (ejercicios con id fijo) al formato actual.
function upgradeSession(s) {
  if (!s || s.plan) return s;
  const day = legacyRoutine().days.find(d => d.id === s.dayId);
  const ex = {};
  for (const [id, sets] of Object.entries(s.ex || {})) ex[LEGACY_NAMES[id] ? exKey(LEGACY_NAMES[id]) : id] = sets;
  return {
    ...s, ex, routineId: 'r1', routineName: 'Rutina inicial', dayName: day?.name || '?',
    plan: day ? makePlan(day) : [],
    phases: { warmup: { rounds: LEGACY_ROUTINE.warmup.rounds, items: [...LEGACY_ROUTINE.warmup.items] }, cooldown: emptyPhase() },
    warmup: s.warmup || [], cooldown: [],
  };
}

if (stored && stored.v !== 2) {
  db.routines = [legacyRoutine()];
  db.activeId = 'r1';
  db.sessions = (db.sessions || []).map(upgradeSession);
  db.current = upgradeSession(db.current);
  db.v = 2;
  save();
}

const routineById = id => db.routines.find(r => r.id === id);
const activeRoutine = () => routineById(db.activeId) || null;

function lastSets(key) {
  for (let i = db.sessions.length - 1; i >= 0; i--) {
    const s = db.sessions[i];
    const sets = s.ex?.[key]?.filter(x => x.done);
    if (sets?.length) return { date: s.start, sets };
  }
  return null;
}
const lastOfDay = (r, dayId) => [...db.sessions].reverse().find(s => s.routineId === r.id && s.dayId === dayId);
function nextDayId(r) {
  const last = [...db.sessions].reverse().find(s => s.routineId === r.id);
  const i = last ? r.days.findIndex(d => d.id === last.dayId) : -1;
  return r.days[(i + 1) % r.days.length]?.id;
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.id); toast.id = setTimeout(() => t.hidden = true, 2200);
}

/* ---------- Navegación ---------- */
const view = () => location.hash.slice(1);
function go(v) { if (view() === v) render(); else location.hash = v; }
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

function render() {
  const v = view();
  if (v === 'session' && db.current) renderSession();
  else if (v === 'history') renderHistory();
  else if (v === 'routines') renderRoutines();
  else if (v === 'edit') db.draft ? renderEditor() : go('routines');
  else renderHome();
  keepAwake(v === 'session' && !!db.current);
}

/* ---------- Inicio ---------- */
function renderHome() {
  const r = activeRoutine(), cur = db.current;
  const next = r && !cur ? nextDayId(r) : null;
  app.innerHTML = `
    <header class="bar">
      <span class="brand">Simple<span>Gym</span></span><span></span>
      <span class="row nowrap">
        <button class="ghost" data-act="routines">Rutinas</button>
        <button class="ghost" data-act="history">Historial</button>
      </span>
    </header>
    ${cur ? `
      <button class="resume" data-act="resume">
        <span><b>Sesión en curso</b><small>${esc(cur.dayName)} · desde las ${fmtTime(cur.start)}</small></span>
        <span class="arrow">Continuar →</span>
      </button>` : ''}
    ${r ? `
      <div class="section-title">${esc(r.name)} · elegí el día</div>
      ${r.days.map(d => {
        const last = lastOfDay(r, d.id);
        return `
        <button class="day ${d.id === next ? 'next' : ''}" data-act="start" data-day="${esc(d.id)}">
          <div class="day-top"><span class="day-name">${esc(d.name)}</span>${d.id === next ? '<span class="pill">Siguiente</span>' : ''}</div>
          <div class="day-ex">${d.ex.map(e => esc(e.name)).join(' · ')}</div>
          <div class="day-last">${last ? 'Último: ' + fmtDate(last.start) : '<span class="muted">Sin registros</span>'}</div>
        </button>`;
      }).join('')}
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}` : `
      <div class="card empty-card">
        <h2>Todavía no hay rutinas</h2>
        <p class="muted">Cargá la rutina que te dieron: días, ejercicios, series y repeticiones.</p>
        <button class="primary" data-act="new-routine">Crear rutina</button>
      </div>`}`;
}

function startSession(dayId) {
  const r = activeRoutine(), day = r?.days.find(d => d.id === dayId);
  if (!day) return;
  if (db.current) {
    if (db.current.routineId === r.id && db.current.dayId === dayId) return go('session');
    if (!confirm(`Tenés una sesión en curso (${db.current.dayName}). ¿Descartarla y empezar ${day.name}?`)) return;
  }
  const plan = makePlan(day), ex = {};
  for (const e of plan) {
    const last = lastSets(e.key);
    ex[e.key] = Array.from({ length: e.sets }, (_, i) => ({
      w: last ? (last.sets[i] ?? last.sets.at(-1)).w : '',
      r: '', done: false,
    }));
  }
  db.current = {
    id: uid(), routineId: r.id, routineName: r.name, dayId, dayName: day.name, start: Date.now(),
    plan, phases: { warmup: structuredClone(r.warmup), cooldown: structuredClone(r.cooldown) },
    warmup: [], cooldown: [], ex, note: '',
  };
  save();
  go('session');
}

/* ---------- Sesión ---------- */
function exCard(e, sets) {
  const last = lastSets(e.key);
  const done = sets.filter(x => x.done).length;
  return `
  <article class="card ex ${done >= sets.length ? 'complete' : ''}" data-ex="${esc(e.key)}">
    <div class="ex-head"><h2>${esc(e.name)}</h2><span class="target">${e.reps ? `${e.sets} × ${esc(e.reps)}` : `${e.sets} series`}</span></div>
    <div class="prev">${last ? `Anterior (${fmtDate(last.date)}): ${last.sets.map(fmtSet).join(' · ')}` : 'Primera vez'}</div>
    ${sets.map((x, i) => {
      const ph = (last?.sets[i] ?? last?.sets.at(-1))?.r || firstNum(e.reps);
      return `
      <div class="set ${x.done ? 'done' : ''}" data-i="${i}">
        <span class="n">${i + 1}</span>
        <label class="field"><input type="text" inputmode="decimal" data-k="w" value="${esc(x.w)}" placeholder="—" autocomplete="off" aria-label="Peso serie ${i + 1}"><span>kg</span></label>
        <label class="field"><input type="text" inputmode="numeric" data-k="r" value="${esc(x.r)}" placeholder="${esc(ph)}" autocomplete="off" aria-label="Repeticiones serie ${i + 1}"><span>reps</span></label>
        <button class="check" data-act="set" aria-label="Serie ${i + 1} hecha">✓</button>
      </div>`;
    }).join('')}
    <div class="ex-foot">
      <span class="count">${done}/${sets.length} series</span><span class="spacer"></span>
      <button class="mini" data-act="rmset" ${sets.length <= 1 ? 'disabled' : ''}>− serie</button>
      <button class="mini" data-act="addset">+ serie</button>
    </div>
  </article>`;
}

// Entrada en calor / elongación: lista de ítems con un check por vuelta. Si no tiene ítems, no se muestra.
function phaseCard(kind, title) {
  const s = db.current, p = s.phases?.[kind];
  if (!p?.items.length) return '';
  const st = s[kind] ||= [], total = phaseTotal(p), done = st.filter(Boolean).length;
  const cols = `style="grid-template-columns: 1fr repeat(${p.rounds}, 48px)"`;
  return `
    <details class="card" ${done < total ? 'open' : ''}>
      <summary><span>${title}</span><span class="count" data-count="${kind}">${done}/${total}</span></summary>
      ${p.rounds > 1 ? `<div class="wu-head" ${cols}><span></span>${Array.from({ length: p.rounds }, (_, r) => `<span>Vuelta ${r + 1}</span>`).join('')}</div>` : ''}
      ${p.items.map((it, i) => `
        <div class="wu-row" ${cols}><span>${esc(it)}</span>
          ${Array.from({ length: p.rounds }, (_, r) => {
            const k = r * p.items.length + i;
            return `<button class="check sm ${st[k] ? 'on' : ''}" data-act="phase" data-phase="${kind}" data-k="${k}" aria-label="${p.rounds > 1 ? `Vuelta ${r + 1}` : 'Hecho'}">✓</button>`;
          }).join('')}
        </div>`).join('')}
    </details>`;
}

function renderSession() {
  const s = db.current;
  app.innerHTML = `
    <header class="bar sticky">
      <button class="ghost" data-act="home">← Inicio</button>
      <h1>${esc(s.dayName)}</h1>
      <span class="elapsed" id="elapsed">${fmtDur(Date.now() - s.start)}</span>
    </header>
    ${phaseCard('warmup', 'Entrada en calor')}
    ${s.plan.map(e => exCard(e, s.ex[e.key] ||= Array.from({ length: e.sets }, () => ({ w: '', r: '', done: false })))).join('')}
    ${phaseCard('cooldown', 'Elongación')}
    <label class="card notes"><span>Notas</span>
      <textarea data-k="note" rows="3" placeholder="Sensaciones, cambios de carga, molestias…">${esc(s.note)}</textarea>
    </label>
    <button class="primary" data-act="finish">Terminar y guardar</button>
    <button class="ghost danger block" data-act="discard">Descartar sesión</button>`;
}

const planEx = key => db.current.plan.find(x => x.key === key);

function refreshCard(card) {
  const e = planEx(card.dataset.ex);
  card.outerHTML = exCard(e, db.current.ex[e.key]);
}

function toggleSet(btn) {
  const card = btn.closest('.ex'), row = btn.closest('.set');
  const sets = db.current.ex[card.dataset.ex], x = sets[+row.dataset.i];
  x.done = !x.done;
  if (x.done) {
    const r = $('[data-k=r]', row), w = $('[data-k=w]', row);
    if (!r.value.trim()) r.value = r.placeholder;
    x.r = r.value.trim(); x.w = w.value.trim();
    // Copiar peso y reps a la serie siguiente si todavía no está hecha.
    const next = sets[+row.dataset.i + 1], nextRow = row.nextElementSibling;
    if (next && !next.done && nextRow?.classList.contains('set')) {
      next.w = x.w; next.r = x.r;
      $('[data-k=w]', nextRow).value = x.w;
      $('[data-k=r]', nextRow).value = x.r;
    }
    startRest(planEx(card.dataset.ex)?.rest || REST_SECONDS);
  }
  row.classList.toggle('done', x.done);
  const done = sets.filter(y => y.done).length;
  $('.count', card).textContent = `${done}/${sets.length} series`;
  card.classList.toggle('complete', done >= sets.length);
  save();
}

function finish() {
  const s = db.current;
  const done = Object.values(s.ex).flat().filter(x => x.done).length;
  if (!done && !confirm('No marcaste ninguna serie. ¿Guardar igual?')) return;
  db.sessions.push({ ...s, end: Date.now() });
  db.current = null;
  save(); stopRest();
  go('');
  toast('Sesión guardada 💪');
}

/* ---------- Rutinas ---------- */
function renderRoutines() {

      <button class="resume" data-act="resume-draft">

        <span class="arrow">Seguir →</span>

    ${db.routines.map(r => {

        <div class="day-ex">${r.days.length} ${r.days.length === 1 ? 'día' : 'días'} · ${r.days.reduce((n, d) => n + d.ex.length, 0)} ejercicios</div>
        <div class="row">

    <button class="primary" data-act="new-routine">+ Nueva rutina</button>`;

/* ---------- Editor de rutinas ---------- */
// Se edita un borrador (db.draft) que se guarda en cada tecla; la rutina real cambia recién al tocar "Guardar".
const newEx = () => ({ name: '', sets: '3', reps: '', rest: '' });
const newDay = n => ({ id: uid(), name: `Día ${n}`, ex: [newEx()] });

function openEditor(routine, copy = false) {
  if (routine && !copy && db.draft?.draftOf === routine.id) return go('edit');
  if (db.draft && !confirm(`Tenés un borrador sin guardar (${db.draft.name || 'sin nombre'}). ¿Descartarlo?`)) return;
  if (routine) {
    db.draft = structuredClone(routine);
    db.draft.draftOf = copy ? null : routine.id;
    if (copy) { db.draft.name += ' (copia)'; delete db.draft.created; }
  } else {
    db.draft = { name: '', note: '', warmup: emptyPhase(), cooldown: emptyPhase(), days: [newDay(1)], draftOf: null };
  }
  save(); go('edit');
}

function renderEditor() {
  const d = db.draft;
  app.innerHTML = `
    <header class="bar sticky">
      <button class="ghost" data-act="ed-cancel">Cancelar</button>
      <h1>${d.draftOf ? 'Editar rutina' : 'Nueva rutina'}</h1>
      <button class="ghost accent-text" data-act="ed-save">Guardar</button>
    </header>
    <div class="card">
      <label class="lbl">Nombre<input class="inp" data-p="name" value="${esc(d.name)}" placeholder="Ej.: Rutina noviembre" autocomplete="off"></label>
      <label class="lbl">Nota (opcional)<textarea class="inp" data-p="note" rows="2" placeholder="Aclaraciones generales">${esc(d.note)}</textarea></label>
    </div>
    ${phaseEditor(...PHASES[0])}
    ${d.days.map(dayEditor).join('')}
    <button class="mini block" data-act="ed-add-day">+ Agregar día</button>
    ${phaseEditor(...PHASES[1])}
    <button class="primary" data-act="ed-save">Guardar rutina</button>
    <button class="ghost block" data-act="ed-cancel">Cancelar</button>
    ${datalist('ex-names', knownNames(r => r.days.flatMap(day => day.ex.map(e => e.name)), s => (s.plan || []).map(e => e.name)))}
    ${datalist('phase-items', knownNames(r => [...r.warmup.items, ...r.cooldown.items], s => PHASES.flatMap(([k]) => s.phases?.[k]?.items || [])))}`;
}

// Nombres ya usados en rutinas guardadas e historial, para sugerir al escribir.
// Sin duplicados (por clave de nombre) y con la escritura más reciente.
function knownNames(fromRoutine, fromSession) {
  const seen = new Map();
  const add = n => { const k = exKey(n); if (n && !seen.has(k)) seen.set(k, n); };
  [...db.routines].reverse().forEach(r => fromRoutine(r).forEach(add));
  [...db.sessions].reverse().forEach(s => fromSession(s).forEach(add));
  return [...seen.values()].sort((a, b) => a.localeCompare(b, 'es'));
}
const datalist = (id, names) => `<datalist id="${id}">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;

function phaseEditor(kind, title, ph) {
  const p = db.draft[kind];
  return `
    <section class="card">
      <div class="ed-head"><h2>${title}</h2>
        <label class="lbl inline">Vueltas
          <select class="inp" data-p="${kind}.rounds">${Array.from({ length: MAX_ROUNDS }, (_, i) =>
            `<option ${i + 1 === +p.rounds ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>
        </label>
      </div>
      ${p.items.length ? '' : '<p class="muted hint">Vacía: no aparece en la sesión.</p>'}
      ${p.items.map((it, i) => `
        <div class="ed-row">
          <input class="inp" list="phase-items" data-p="${kind}.items.${i}" value="${esc(it)}" placeholder="${esc(ph)}" autocomplete="off">
          <button class="icon-btn" data-act="ed-del" data-p="${kind}.items.${i}" aria-label="Quitar ítem">✕</button>
        </div>`).join('')}
      <button class="mini" data-act="ed-add-item" data-phase="${kind}">+ ítem</button>
    </section>`;
}

function dayEditor(day, di) {
  return `
    <section class="card">
      <div class="ed-row">
        <input class="inp day-inp" data-p="days.${di}.name" value="${esc(day.name)}" placeholder="Nombre del día" autocomplete="off">
        <button class="icon-btn" data-act="ed-del" data-p="days.${di}" aria-label="Eliminar día">✕</button>
      </div>
      ${day.ex.map((e, ei) => {
        const p = `days.${di}.ex.${ei}`;
        return `
        <div class="ed-ex">
          <div class="ed-row"><span class="n">${ei + 1}</span>
            <input class="inp" list="ex-names" data-p="${p}.name" value="${esc(e.name)}" placeholder="Ejercicio" autocomplete="off"></div>
          <div class="ed-grid">
            <label class="lbl">Series<input class="inp" data-p="${p}.sets" value="${esc(e.sets)}" inputmode="numeric" autocomplete="off"></label>
            <label class="lbl">Reps<input class="inp" data-p="${p}.reps" value="${esc(e.reps)}" placeholder="8–10" autocomplete="off"></label>
            <label class="lbl">Descanso (s)<input class="inp" data-p="${p}.rest" value="${esc(e.rest ?? '')}" placeholder="${REST_SECONDS}" inputmode="numeric" autocomplete="off"></label>
          </div>
          <div class="ed-tools">
            <button class="icon-btn" data-act="ed-move" data-p="${p}" data-dir="-1" ${ei === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
            <button class="icon-btn" data-act="ed-move" data-p="${p}" data-dir="1" ${ei === day.ex.length - 1 ? 'disabled' : ''} aria-label="Bajar">↓</button>
            <button class="icon-btn" data-act="ed-del" data-p="${p}" aria-label="Quitar ejercicio">✕</button>
          </div>
        </div>`;
      }).join('')}
      <button class="mini" data-act="ed-add-ex" data-d="${di}">+ ejercicio</button>
    </section>`;
}

// "days.0.ex.2.name" → [objeto contenedor, clave]
function draftRef(path) {
  const k = path.split('.'), last = k.pop();
  let o = db.draft;
  for (const x of k) o = o[x];
  return [o, last];
}
function editAndFocus(selector) {
  save(); renderEditor();
  const el = $(selector, app);
  if (el) { el.focus(); el.scrollIntoView({ block: 'center' }); }
}

function saveDraft() {
  const d = db.draft;
  const name = String(d.name).trim();
  if (!name) { toast('Poné un nombre a la rutina'); return $('[data-p="name"]', app)?.focus(); }
  const phase = p => ({ rounds: clampInt(p.rounds, 1, MAX_ROUNDS, 1), items: p.items.map(s => String(s).trim()).filter(Boolean) });
  const days = d.days.map((day, i) => ({
    id: day.id || uid(),
    name: String(day.name).trim() || `Día ${i + 1}`,
    ex: day.ex.filter(e => String(e.name).trim()).map(e => ({
      name: String(e.name).trim(),
      sets: clampInt(e.sets, 1, 10, 3),
      reps: String(e.reps ?? '').trim(),
      rest: String(e.rest ?? '').trim() ? clampInt(e.rest, 10, 600, REST_SECONDS) : null,
    })),
  }));
  if (!days.length) return toast('Agregá al menos un día');
  const empty = days.find(day => !day.ex.length);
  if (empty) return toast(`${empty.name} no tiene ejercicios`);
  const r = { id: d.draftOf || uid(), name, note: String(d.note).trim(), created: d.created || Date.now(),
    warmup: phase(d.warmup), cooldown: phase(d.cooldown), days };
  const i = db.routines.findIndex(x => x.id === r.id);
  if (i >= 0) db.routines[i] = r; else db.routines.push(r);
  db.draft = null;
  if (!activeRoutine() || (i < 0 && confirm(`¿Empezar a usar "${r.name}" ahora?`))) db.activeId = r.id;
  save();
  go(db.activeId === r.id && i < 0 ? '' : 'routines');
  toast('Rutina guardada');
}

function editorClick(b) {
  const d = db.draft;
  switch (b.dataset.act) {
    case 'ed-save': return saveDraft(), true;
    case 'ed-cancel':
      if (confirm('¿Descartar los cambios de esta rutina?')) { db.draft = null; save(); go('routines'); }
      return true;
    case 'ed-add-day':
      d.days.push(newDay(d.days.length + 1));
      return editAndFocus(`[data-p="days.${d.days.length - 1}.ex.0.name"]`), true;
    case 'ed-add-ex': {
      const di = +b.dataset.d, ex = d.days[di].ex;
      ex.push(newEx());
      return editAndFocus(`[data-p="days.${di}.ex.${ex.length - 1}.name"]`), true;
    }
    case 'ed-add-item': {
      const kind = b.dataset.phase, items = d[kind].items;
      items.push('');
      return editAndFocus(`[data-p="${kind}.items.${items.length - 1}"]`), true;
    }
    case 'ed-del': {
      const [arr, i] = draftRef(b.dataset.p);
      if (/^days\.\d+$/.test(b.dataset.p) && arr[i].ex.some(e => String(e.name).trim())
        && !confirm(`¿Eliminar ${arr[i].name || 'este día'} con todos sus ejercicios?`)) return true;
      arr.splice(+i, 1);
      return save(), renderEditor(), true;
    }
    case 'ed-move': {
      const [arr, i] = draftRef(b.dataset.p), j = +i + +b.dataset.dir;
      if (j < 0 || j >= arr.length) return true;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      return save(), renderEditor(), true;
    }
  }
  return false;
}

/* ---------- Historial ---------- */

    <header class="bar">

        ${s.routineName ? `<p class="muted hist-sub">${esc(s.routineName)}</p>` : ''}
        <ul>${(s.plan || []).filter(e => s.ex?.[e.key]?.some(x => x.done)).map(e =>
          `<li><span>${esc(e.name)}</span><span>${s.ex[e.key].filter(x => x.done).map(fmtSet).join(' · ')}</span></li>`).join('')}</ul>
        ${s.note ? `<p class="hist-note">${esc(s.note)}</p>` : ''}

    <div class="card">

      <div class="row">
        <button class="mini" data-act="export">Exportar JSON</button>
        <button class="mini" data-act="import">Importar JSON</button>
      </div>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </div>`;
}

function exportData() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `simplegym-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.sessions)) throw new Error();
    const ids = new Set(db.sessions.map(s => s.id));
    const added = data.sessions.filter(s => s && s.id && !ids.has(s.id)).map(upgradeSession);
    db.sessions = [...db.sessions, ...added].sort((a, b) => a.start - b.start);
    // Rutinas: las del archivo que no estén ya (un backup de la versión 1 trae la rutina inicial).
    const incoming = Array.isArray(data.routines) ? data.routines : data.v === 2 ? [] : [legacyRoutine()];
    const newRoutines = incoming.filter(r => r?.id && Array.isArray(r.days) && !routineById(r.id));
    db.routines.push(...newRoutines);
    if (!activeRoutine() && db.routines.length) db.activeId = db.routines[0].id;
    save(); render();
    toast(`${added.length} sesiones y ${newRoutines.length} rutinas importadas`);
  } catch { toast('Archivo no válido'); }
}

/* ---------- Eventos ---------- */
app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.dataset.act.startsWith('ed-')) return void editorClick(b);
  const s = db.current, id = b.dataset.id;
  switch (b.dataset.act) {
    case 'history': go('history'); break;
    case 'routines': go('routines'); break;
    case 'home': go(''); break;
    case 'resume': go('session'); break;
    case 'resume-draft': go('edit'); break;
    case 'start': startSession(b.dataset.day); break;
    case 'new-routine': openEditor(null); break;
    case 'edit-routine': openEditor(routineById(id)); break;
    case 'dup-routine': openEditor(routineById(id), true); break;
    case 'use-routine':
      db.activeId = id; save(); go('');
      toast(`Usando "${routineById(id).name}"`); break;
    case 'del-routine':
      if (confirm(`¿Eliminar "${routineById(id).name}"? El historial de sesiones se mantiene.`)) {
        db.routines = db.routines.filter(r => r.id !== id); save(); render();
      }
      break;
    case 'phase': {
      const kind = b.dataset.phase, k = +b.dataset.k, st = s[kind] ||= [];
      st[k] = !st[k];
      b.classList.toggle('on', st[k]);
      $(`[data-count="${kind}"]`).textContent = `${st.filter(Boolean).length}/${phaseTotal(s.phases[kind])}`;
      save(); break;
    }
    case 'set': toggleSet(b); break;
    case 'addset': case 'rmset': {
      const card = b.closest('.ex'), sets = s.ex[card.dataset.ex];
      if (b.dataset.act === 'addset') sets.push({ w: sets.at(-1)?.w || '', r: sets.at(-1)?.r || '', done: false });
      else if (sets.length > 1) sets.pop();
      save(); refreshCard(card); break;
    }
    case 'finish': finish(); break;
    case 'discard':
      if (confirm('¿Descartar esta sesión? No se va a guardar.')) { db.current = null; save(); stopRest(); go(''); }
      break;
    case 'del-session':
      if (confirm('¿Eliminar esta sesión del historial?')) {
        db.sessions = db.sessions.filter(x => x.id !== id); save(); render();
      }
      break;
    case 'export': exportData(); break;
    case 'import': $('#file').click(); break;
  }
});

app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.p && db.draft) {
    const [o, k] = draftRef(t.dataset.p);
    o[k] = t.value;
    return save();
  }
  const s = db.current;
  if (!s || !t.dataset.k) return;
  if (t.dataset.k === 'note') { s.note = t.value; return save(); }
  const row = t.closest('.set'), card = t.closest('.ex');
  if (row && card) { s.ex[card.dataset.ex][+row.dataset.i][t.dataset.k] = t.value.trim(); save(); }
});

app.addEventListener('change', ev => {
  if (ev.target.id === 'file' && ev.target.files[0]) importData(ev.target.files[0]);
});

// Seleccionar el contenido al enfocar un número: más rápido de corregir
app.addEventListener('focusin', ev => { if (ev.target.matches('.field input')) ev.target.select(); });

/* ---------- Temporizador de descanso ---------- */
const restEl = $('#rest');
const rest = { end: 0, total: REST_SECONDS, fired: false, hideId: 0 };
let actx;

function unlockAudio() {
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch {}
}
function beep() {
  if (!actx) return;
  const t0 = actx.currentTime;
  [0, 0.25, 0.5].forEach(d => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t0 + d);
    g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18);
    o.connect(g).connect(actx.destination);
    o.start(t0 + d); o.stop(t0 + d + 0.2);
  });
}
function startRest(sec = REST_SECONDS) {
  clearTimeout(rest.hideId);
  Object.assign(rest, { end: Date.now() + sec * 1000, total: sec, fired: false });
  restEl.classList.remove('over');
  restEl.hidden = false; document.body.classList.add('rest-on');
  unlockAudio(); tickRest();
}
function stopRest() {
  clearTimeout(rest.hideId);
  restEl.hidden = true; document.body.classList.remove('rest-on');
}
function tickRest() {
  if (restEl.hidden) return;
  const left = Math.max(0, rest.end - Date.now());
  $('#rest-time').textContent = left > 0 ? mmss(left) : '¡Vamos!';
  $('#rest-fill').style.width = `${Math.min(100, left / (rest.total * 1000) * 100)}%`;
  if (left === 0 && !rest.fired) {
    rest.fired = true;
    restEl.classList.add('over');
    navigator.vibrate?.([200, 100, 200]);
    beep();
    rest.hideId = setTimeout(stopRest, 5000);
  }
}
restEl.addEventListener('click', ev => {
  const v = ev.target.closest('[data-rest]')?.dataset.rest;
  if (!v) return;
  if (v === 'x') return stopRest();
  const left = Math.max(0, rest.end - Date.now()) / 1000;
  const sec = Math.max(5, Math.round(left + +v));
  rest.fired ? startRest(Math.max(15, +v)) : (rest.end = Date.now() + sec * 1000, rest.total = Math.max(rest.total, sec), tickRest());
});

setInterval(() => {
  const el = $('#elapsed');
  if (el && db.current) el.textContent = fmtDur(Date.now() - db.current.start);
  tickRest();
}, 250);

/* ---------- Pantalla siempre encendida durante la sesión ---------- */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => wakeLock = null);
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch {}
}
document.addEventListener('visibilitychange', () => keepAwake(view() === 'session' && !!db.current));

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
</script>
